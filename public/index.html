<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>SKY MEAL</title>
<style>
:root{--bg:#F5F3F0;--card:#FFFFFF;--ink:#1C1917;--mut:#79716B;--line:#E7E3DE;--gold:#C9A35C;--goldink:#1C1917;--acc:#15803D;--accbg:#EAF5EE;--red:#DC2626;--redbg:#FCEBEA;--amb:#B45309;--ambbg:#FBF3E6;--blu:#1D4ED8;--blubg:#DBEAFE}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;padding-bottom:76px}
header{position:sticky;top:0;background:var(--bg);padding:12px 16px 8px;display:flex;justify-content:space-between;align-items:center;z-index:5;border-bottom:1px solid var(--line)}
header h1{font-size:17px;font-weight:600}
header .who{font-size:12px;color:var(--mut)}
main{padding:12px 12px 20px;max-width:680px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.tap{cursor:pointer}.tap:active{opacity:.85}
.cbody{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:12px;background:var(--gold);color:var(--goldink);font-size:16px;font-weight:700;cursor:pointer}
.btn:active{transform:scale(.98)}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.grn{color:#fff}
.btn.red{color:#fff}
.btn.grn{background:var(--acc)}
.btn.red{background:var(--red)}
.btn:disabled{opacity:.35}
.sm{font-size:13px;padding:8px 12px;width:auto;display:inline-block}
input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:var(--card);color:var(--ink)}
input.big{font-size:26px;font-weight:600;text-align:center}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
.row{display:flex;gap:8px}.row>*{flex:1}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600}
.ok{background:var(--accbg);color:var(--acc)}.bad{background:var(--redbg);color:var(--red)}.warn{background:var(--ambbg);color:var(--amb)}.info{background:var(--blubg);color:var(--blu)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:5}
nav button{flex:1;padding:12px 2px;border:none;background:none;font-size:11px;color:var(--mut);cursor:pointer;line-height:1.2}
nav button.on{color:var(--gold);font-weight:700}
nav button .ic{display:none}
.li{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:8px}
.li:last-child{border:none}
.li .nm{flex:1;font-size:14px}
.li .vl{font-weight:600;font-size:14px;white-space:nowrap}
.sub{font-size:11px;color:var(--mut)}
h2{font-size:14px;font-weight:600;margin:4px 0 10px}
.step{display:flex;align-items:center;gap:8px}
.step button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:20px;cursor:pointer}
.step span{min-width:40px;text-align:center;font-size:19px;font-weight:600}
.toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--card);color:var(--ink);border:1px solid var(--gold);padding:10px 18px;border-radius:99px;font-size:13px;z-index:99;opacity:0;transition:.25s;max-width:92%;text-align:center;box-shadow:0 4px 20px rgba(28,25,23,.12)}
.toast.show{opacity:1}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:280px;margin:16px auto}
.pinpad button{padding:17px;font-size:21px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer}
.dots{text-align:center;font-size:28px;letter-spacing:10px;min-height:36px}
.search{position:relative;margin-bottom:10px}
.search input{padding-left:36px}
.search::before{content:'🔍';position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px}
.search .clr{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:15px;color:var(--mut);cursor:pointer;display:none;padding:4px}
.srlist{background:var(--card);border:1px solid var(--line);border-radius:10px;max-height:260px;overflow-y:auto;margin-top:4px}
.worklist{max-height:320px;overflow-y:auto;margin-bottom:8px}
.nomlist{max-height:420px;overflow-y:auto;margin-bottom:8px}
.stocklist{max-height:420px;overflow-y:auto;margin-bottom:8px}
.sritem{padding:12px 14px;cursor:pointer;border-bottom:1px solid var(--line);font-size:14px}
.sritem:last-child{border:none}
.sritem:active{background:var(--bg)}
.tabbar{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px}
.tabbar button{padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:13px;white-space:nowrap;cursor:pointer}
.tabbar button.on{background:var(--gold);color:var(--goldink);border-color:var(--gold);font-weight:700}
.chev{font-size:11px;color:var(--mut);transition:transform .2s;display:inline-block;margin-right:4px}
.chev.open{transform:rotate(90deg)}
.done{background:var(--accbg);border:1px solid #BBF7D0;border-radius:14px;padding:14px;margin-bottom:10px;text-align:center}
.hl{font-size:11px;color:var(--gold);margin:14px 0 5px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px}
.kpis{display:flex;text-align:center;padding:2px 0}
.kpis>div{flex:1}
.kpis .n{display:block;font-size:17px;font-weight:700;margin-top:2px}
.kpis .l{font-size:11px;color:var(--mut)}
.datehead{font-size:11px;color:var(--mut);font-weight:600;margin:12px 0 4px;padding-left:2px}
.alertbar{display:flex;justify-content:space-between;align-items:center;background:var(--ambbg);color:var(--amb);border-radius:12px;padding:10px 14px;margin-bottom:10px;font-size:13px}
.rtable{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border-radius:12px;overflow:hidden;margin-bottom:14px}
.rtable th{text-align:left;padding:8px 10px;background:var(--bg);color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.rtable td{padding:7px 10px;border-top:1px solid var(--line);white-space:nowrap}
@media print{
  nav,header,.noprint{display:none!important}
  main{padding:0!important}
  body{background:#fff!important}
  .card{box-shadow:none!important;border:1px solid #ddd}
}
h2{letter-spacing:.3px}
header img.lg{height:26px;display:block}
.logochip{display:inline-flex;align-items:center;background:#1C1917;padding:6px 16px;border-radius:10px;line-height:0}
.loginlogo{display:block;width:220px}
.loginchip{display:flex;justify-content:center;width:220px;padding:20px 24px;border-radius:16px;margin:0 auto 26px}
.neg{color:var(--red)}
/* ===== ПК: меню слева, контент по центру ===== */
@media(min-width:900px){
  body{padding-bottom:20px}
  header{position:fixed;top:0;left:0;right:0;padding:16px 24px 12px;height:56px;z-index:6}
  nav{top:56px;bottom:0;left:0;right:auto;width:220px;flex-direction:column;border-top:none;border-right:1px solid var(--line);justify-content:flex-start;overflow-y:auto}
  nav button{flex:0 0 auto;width:100%;text-align:left;font-size:15px;padding:14px 22px;border-left:3px solid transparent}
  nav button.on{border-left-color:var(--gold);background:var(--bg)}
  main{margin-left:220px;margin-top:56px;max-width:860px;padding:24px 32px}
  .card{padding:18px}
  input,select{font-size:15px}
  .btn{max-width:420px;margin-left:auto;margin-right:auto}
  .tabbar button{font-size:14px;padding:9px 18px}
}
/* ===== телефон: крупные кнопки, всё влезает ===== */
@media(max-width:899px){
  nav{padding-bottom:env(safe-area-inset-bottom)}
  nav button{font-size:12px;font-weight:600;padding:15px 1px 17px}
  main{padding:12px 10px 20px}
  body{padding-bottom:90px}
  .worklist,.nomlist{max-height:44vh}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<script>
'use strict';
var TOKEN = sessionStorage.getItem('tok') || '';
var ME = JSON.parse(sessionStorage.getItem('me') || 'null');
var D = { products: [], stock: {}, sklads: [], alerts: [] };
var screen = sessionStorage.getItem('screen') || 'prod';
if (screen === 'work') screen = 'prod'; // раздел "Обработка" убран — у кого-то в сессии могла остаться старая ссылка
if (screen === 'orders' || screen === 'wo') screen = 'prod'; // разделы "Заказы"/"Специи" убраны из меню
var pin = '', pickedUser = null;
var exp = {}, busy = false;
var wSel = null, wDone = null, wQ = '';
var pCnt = {}, pDate = null, pFrom = null, pTo = null;
var stockTabDept = '', nomTab = 'raw', recFilter = 'all';
var outFrom = null, outTo = null;
var lossFrom = null, lossTo = null;
var syncDate = null, rcptOpen = false;
var woItems = [], woQ = '';
var editRecipe = [];
var nomPasteOpen = false, nomPasteText = '';
var stPasteOpen = false, stPasteText = '';
var clPasteOpen = false, clPasteText = '';
var salesPasteOpen = false, salesPasteText = '';
var payPasteOpen = false, payPasteText = '';
var specsPasteOpen = false, specsPasteText = '';
var agentQ = '', agentSel = null, agentQty = 1, agentPrice = 0;
var agentClientId = null, agentClientQ = '', agentClientsCache = [];
var agentMode = 'quick', agentCart = [], agentCartQ = '';
var agentCash = 0, agentQr = 0, agentFrom = null, agentTo = null;
var agentStockCache = []; // остаток экспедитора на борту — то, что взял сам
var agentExProduct = null, agentExQtyOut = 1, agentExQtyBack = 1, agentExClient = ''; // обмен по сроку годности
var myLoadCart = [], myLoadQ = ''; // экспедитор: "взял с собой" — сам, без менеджера
var myLoadStockCache = [];
var agentsCache = [];
var vedAgentId = null; // менеджер: чью ведомость сейчас смотрим
var newUserRole = 'agent';

var $ = function(s){ return document.querySelector(s); };
var app = $('#app');
var fmt = function(n){ return (Math.round((+n||0)*100)/100).toLocaleString('ru-RU'); };
var money = function(n){ return fmt(n) + ' ₸'; };
var today = function(){ return new Date().toISOString().slice(0,10); };
var P = function(id){ return D.products.find(function(p){ return p.id===id; }) || {name:'?',unit:'',recipe:[],type:'raw',department:'Кухня / Заготовки'}; };
var SK = function(id){ return (D.sklads||[]).find(function(s){ return s.id===id; }) || {name:id||'—'}; };
var esc = function(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
var ROLE = {cook:'повар',cook_prep:'повар заготовок',cook_sand:'повар сэндвичей',cook_hot:'повар горячего',cook_baker:'пекарь',cook_pastry:'кондитер',cook_head:'главный повар',tech:'технолог',manager:'менеджер',admin:'директор',agent:'торговый / водитель'};
var isCook = function(r){ return r==='cook'||r.startsWith('cook_'); };
var hasRecipe = function(p){ return p&&p.recipe&&p.recipe.length>0; };
var CATS = [
  {id:'raw',icon:'🛒',name:'Продукты'},
  {id:'dish',icon:'🥪',name:'Готовые блюда'}
];
var CAT = function(id){ return CATS.find(function(c){ return c.id===id; }) || {icon:'📦',name:id||''}; };
// Цеха — один физический склад на все товары (совпадает с 1С), цех — просто метка "кто с этим товаром работает"
var DEPARTMENTS = ['Кухня / Заготовки','Сэндвичи','Горячее','Хлеб и тесто','Кондитерка','Готовая продукция'];
var UNITS = ['кг','г','шт','л','мл'];
var ST = {
  draft:'<span class="pill warn">✏️ черновик</span>',
  submitted:'<span class="pill info">📨 у технолога</span>',
  approved:'<span class="pill ok">✅ утверждена</span>'
};

function toast(msg,ms){ var t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){ t.classList.remove('show'); },ms||2400); }
async function api(path,method,body){
  var r=await fetch('/api'+path,{method:method||'GET',headers:{'Content-Type':'application/json','x-token':TOKEN},body:body?JSON.stringify(body):undefined});
  var j=await r.json();
  if(r.status===401&&ME){logout();throw new Error('Сессия истекла');}
  if(!r.ok) throw new Error(j.error||'Ошибка');
  return j;
}
function logout(){
  TOKEN='';ME=null;sessionStorage.clear();pickedUser=null;pin='';
  // ИСПРАВЛЕНО: список доступных отчётов кэшировался на весь сеанс браузера (fetch once).
  // Если в одной вкладке сначала зашли директором/техником, потом вышли и зашли менеджером —
  // список отчётов оставался от прошлой роли (тех/директор), а бэкенд на клик закономерно
  // резал 403 "доступен только директору", хотя менеджеру этот отчёт вообще не должен был
  // предлагаться. Сбрасываем кэш и выбранный тип отчёта при каждом выходе.
  reportsListCache=null; reportsType='sales'; reportsFrom=null; reportsTo=null; reportsPeriod=0;
  render();
}
async function reload(){ D=await api('/bootstrap'); }
function opTime(o){ return new Date(o.ts).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}); }
function filterList(list,q){ var lo=q.toLowerCase(); return lo?list.filter(function(p){ return p.name.toLowerCase().includes(lo); }):list; }

// свернуть/развернуть
window.toggle=function(key){ exp[key]=!exp[key]; renderInPlace(); };
function card(key,hdr,body){
  var open=exp[key];
  return '<div class="card tap" onclick="toggle(\''+key+'\')">'
    +'<div style="display:flex;justify-content:space-between;align-items:center">'+hdr+'<span class="chev '+(open?'open':'')+'">▶</span></div>'
    +(open?'<div class="cbody" onclick="event.stopPropagation()">'+body+'</div>':'')
    +'</div>';
}

// ====== ВХОД ======
async function renderLogin(){
  app.innerHTML='<main style="padding-top:60px;max-width:400px;margin:0 auto">'
    +'<span class="logochip loginchip"><img src="/logo.png" alt="SKY MEAL" class="loginlogo"></span>'
    +'<div class="card" style="padding:24px">'
    +'<label style="font-size:14px">Роль</label>'
    +'<select id="logincat" style="font-size:17px;padding:14px">'
    +'<option value="cook">Повар</option>'
    +'<option value="tech">Технолог</option>'
    +'<option value="manager">Менеджер</option>'
    +'<option value="agent">Торговый / водитель</option>'
    +'<option value="admin">Директор</option>'
    +'</select>'
    +'<label style="font-size:14px">Пароль</label>'
    +'<input id="loginpin" type="password" inputmode="numeric" placeholder="****" style="font-size:22px;padding:14px;text-align:center;letter-spacing:6px" onkeydown="if(event.key===\'Enter\')doLogin()">'
    +'<div style="height:20px"></div>'
    +'<button class="btn" onclick="doLogin()">Войти</button>'
    +'</div></main>';
}
window.doLogin=async function(){
  var cat=$('#logincat').value, pinVal=$('#loginpin').value;
  if(!pinVal) return toast('Введите пароль');
  try{
    var r=await api('/login','POST',{category:cat,pin:pinVal});
    TOKEN=r.token; ME=r.user;
    sessionStorage.setItem('tok',TOKEN); sessionStorage.setItem('me',JSON.stringify(ME));
    screen=isCook(ME.role)?'prod':ME.role==='agent'?'agent':ME.role==='tech'?'nom':ME.role==='manager'?'sales':'cost';
    await reload(); render();
  }catch(e){ toast(e.message); $('#loginpin').value=''; }
};

// ====== КАРКАС ======
var NAVS={
  cook:      [['prod','🥪','Выпуск'],['nom','🏷️','Продукты'],['stock','📋 ','Остатки']],
  cook_prep: [['prod','🥪','Выпуск'],['nom','🏷️','Продукты'],['stock','📋 ','Остатки']],
  cook_sand: [['prod','🥪','Выпуск'],['nom','🏷️','Продукты'],['stock','📋 ','Остатки']],
  cook_hot:  [['prod','🥪','Выпуск'],['nom','🏷️','Продукты'],['stock','📋 ','Остатки']],
  cook_baker:[['prod','🥪','Выпуск'],['nom','🏷️','Продукты'],['stock','📋 ','Остатки']],
  cook_pastry:[['prod','🥪','Выпуск'],['nom','🏷️','Продукты'],['stock','📋 ','Остатки']],
  cook_head: [['prod','🥪','Выпуск'],['nom','🏷️','Продукты'],['stock','📋 ','Остатки']],
  agent:     [['agent','🚚','Продажи']],
  tech:      [['prod','🥪','Выпуск'],['nom','🏷️','Продукты'],['output','📊',  'Выработка'],['stock','📋','Остатки'],['reports','📈','Отчёты']],
  manager:   [['sales','💵','Продажи'],['stock','📋','Остатки'],['reports','📈','Отчёты']],
  admin:     [['sales','💵','Продажи'],['cost','💰','Калькуляция'],['output','📊','Выработка'],['stock','📋','Остатки'],['losses','📉','Потери'],['reports','📈','Отчёты'],['sync','🔄','1С'],['users','🔒','Доступы']]
};
function shell(inner){
  var navs=NAVS[ME.role]||NAVS.admin;
  var navHtml=navs.map(function(n){
    return '<button class="'+(screen===n[0]?'on':'')+'" onclick="go(\''+n[0]+'\')">'
      +'<span class="ic">'+n[1]+'</span>'+n[2]+'</button>';
  }).join('');
  var alertsHtml='';
  if((ME.role==='admin'||ME.role==='tech')&&D.alerts&&D.alerts.length){
    alertsHtml='<div class="card" style="border-color:var(--amb);background:var(--ambbg)">'
      +'<div style="display:flex;justify-content:space-between;align-items:center;gap:8px">'
      +'<b>⚠️ Уведомления ('+D.alerts.length+')</b>'
      +'<button class="btn sec sm" onclick="alertsRead()">Прочитано</button></div>'
      +D.alerts.slice(0,5).map(function(a){ return '<div class="sub" style="margin-top:6px">'+esc(a.msg)+'</div>'; }).join('')
      +'</div>';
  }
  app.innerHTML='<header><span class="logochip"><img src="/logo.png" alt="SKY MEAL" class="lg"></span><span class="who">'+esc(ME.name)+' · '+(ROLE[ME.role]||ME.role)+' · <a href="#" onclick="logout();return false" style="color:var(--mut)">выйти</a></span></header>'
    +'<main id="m">'+alertsHtml+inner+'</main>'
    +'<nav>'+navHtml+'</nav>';
}
window.alertsRead=async function(){
  try{ await api('/alerts/read','POST'); await reload(); render(); }
  catch(e){ toast(e.message); }
};
window.go=async function(s){ screen=s;sessionStorage.setItem('screen',s);wSel=null;wDone=null;exp={};await reload();render(); };
window.logout=logout;

// счётчик поколений рендера: если пока грузился ответ сервера пользователь напечатал ещё
// букву (запустился новый renderInPlace), устаревший результат не должен затирать свежий —
// иначе поле поиска дёргается и "откатывается" на предыдущую букву.
// защита от двойного тапа: на слабом мобильном интернете курьер может тапнуть кнопку
// дважды (или один раз, решить что "не сработало", и ещё раз) — без этого флага улетело
// бы два одинаковых запроса и появилась бы задвоенная продажа/накладная/обмен.
var submitting=false;
async function guardedSubmit(fn){
  if(submitting) return;
  submitting=true;
  try{ await fn(); } finally{ submitting=false; }
}
var renderGen=0;
function renderInPlace(){
  var fn=SCREENS[screen]; if(!fn) return;
  var myGen=++renderGen;
  // ПОЛЕ ВВОДА, В КОТОРОМ СЕЙЧАС ПЕЧАТАЮТ, ТЕРЯЕТ ФОКУС ПРИ ПОЛНОЙ ПЕРЕРИСОВКЕ innerHTML —
  // старый <input> уничтожается, новый создаётся без фокуса, и вторая буква уже никуда не попадает.
  // Запоминаем, что было сфокусировано и где стоял курсор, и восстанавливаем после перерисовки.
  var active=document.activeElement;
  var activeId=(active&&active.id)?active.id:null;
  var selStart=null, selEnd=null;
  if(activeId&&active&&typeof active.selectionStart==='number'){ selStart=active.selectionStart; selEnd=active.selectionEnd; }
  function restoreFocus(){
    if(!activeId) return;
    var el=document.getElementById(activeId);
    if(el&&document.activeElement!==el){
      el.focus();
      if(selStart!=null&&el.setSelectionRange){ try{ el.setSelectionRange(selStart,selEnd); }catch(e){} }
    }
  }
  var out=fn();
  if(out instanceof Promise) out.then(function(h){ if(myGen!==renderGen) return; if($('#m')){ $('#m').innerHTML=h; restoreFocus(); } }).catch(function(e){ if(myGen!==renderGen) return; if($('#m')) $('#m').innerHTML='<p class="sub">'+esc(e.message)+'</p>'; });
  else if($('#m')){ $('#m').innerHTML=out; restoreFocus(); }
}

// ====== ПОВАР: ОБРАБОТКА ======

  var rows=D.products.filter(function(p){ return p.department===invDept; });
  var listHtml=rows.map(function(p){
    var st=D.stock[p.id];

        ?'<input type="number" step="0.01" inputmode="decimal" value="'+val+'" style="width:100px;text-align:center" onfocus="this.select()" onchange="invChange(\''+p.id+'\',this.value)">'

  var saveBtn=isAdmin?'<button class="btn" style="margin-top:10px" onclick="invSave()">Сохранить инвентаризацию</button>':'';
  var hist='';

    var h=await api('/inv/history');
    hist='<div class="hl" style="margin-top:16px">История инвентаризаций</div>'
      +(h.length?h.map(function(iv){
        var diffRows=iv.rows.filter(function(r){ return Math.abs(r.diff)>0.001; });
        return card('iv'+iv.id,
          '<span style="flex:1">'+new Date(iv.ts).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+' · '+esc(iv.user)+'</span><b class="'+(iv.total<0?'neg':'')+'">'+money(iv.total)+'</b>',
          diffRows.length?diffRows.map(function(r){

          }).join(''):'<p class="sub">Расхождений нет.</p>'
        );
      }).join(''):'<p class="sub">Инвентаризаций ещё не было.</p>');
  }
  return '<h2>Инвентаризация</h2>'
    +(isAdmin
      ?'<p class="sub" style="margin-bottom:10px">Выберите цех, поправьте фактические остатки и сохраните — разница спишется или оприходуется автоматически.</p>'
      :'<p class="sub" style="margin-bottom:10px">Просмотр остатков. Сохранять инвентаризацию может только директор.</p>')
    +tabsHtml

}

window.invSave=async function(){
  if(busy) return;
  var mainSkId=(D.sklads&&D.sklads[0]?D.sklads[0].id:'sk1');
  var deptPids={}; D.products.filter(function(p){ return p.department===invDept; }).forEach(function(p){ deptPids[p.id]=true; });
  var pids=Object.keys(invVals).filter(function(pid){ return deptPids[pid]&&invVals[pid]!==''&&invVals[pid]!=null; });
  var items=pids.map(function(pid){ return {productId:pid,skladId:mainSkId,factQty:+invVals[pid]}; });

};

  var clientOpts='<option value="">Все клиенты</option>'+clientKeys
    .map(function(k){ return '<option value="'+esc(k)+'" '+(saleClientFilter===k?'selected':'')+'>'+esc(clientNameByKey[k])+'</option>'; }).join('');

    .map(function(id){ return '<option value="'+id+'" '+(saleProductFilter===id?'selected':'')+'>'+esc(productNameById[id])+'</option>'; }).join('');

      +'<button class="btn sec sm" style="margin-top:8px" onclick="event.stopPropagation();go(\'sync\')">Открыть полную сверку в разделе «1С»</button>'
    );
  } else if(ME.role==='admin'){
    sync1cHtml='<p class="sub">Сверка с 1С по реализации ещё не запускалась — раздел «1С» → «Сверка реализации».</p>';
  }

  // --- список продаж: фильтр по продавцу/статусу/поиску применяется всегда; по клиенту и товару —
  // тоже, но их держим отдельно от baseRows, чтобы группировки "по клиентам"/"по товару" ниже могли
  // учитывать один из этих двух фильтров, оставаясь группировкой именно по другому измерению. ---
  var saleAgentOk=function(s){ return !saleAgentFilter||s.sellerId===saleAgentFilter; };
  var saleStatusOk=function(s){ if(saleStatusFilter==='paid') return s.paid; if(saleStatusFilter==='debt') return !s.paid; return true; };
  var saleSearchOk=function(s){
    if(!saleSearchQ) return true;
    var q=saleSearchQ.toLowerCase();
    return s.name.toLowerCase().includes(q) || (s.client||'').toLowerCase().includes(q) || (s.sellerName||'').toLowerCase().includes(q);
  };
  var saleClientOk=function(s){ return !saleClientFilter||saleClientKey(s)===saleClientFilter; };
  var saleProductOk=function(s){ return !saleProductFilter||(s.lines||[]).some(function(l){ return l.productId===saleProductFilter; }); };
  var baseRows=r.rows.filter(saleAgentOk).filter(saleStatusOk).filter(saleSearchOk);
  var filteredRows=baseRows.filter(saleClientOk).filter(saleProductOk);
  var rowsHtml='';
  if(!filteredRows.length){
    rowsHtml='<p class="sub">Ничего не найдено за этот период.</p>';
  } else {
    rowsHtml='<div style="overflow-x:auto"><table class="rtable"><thead><tr>'
      +'<th>Время</th><th>Блюдо</th><th>Продавец</th><th>Клиент</th><th style="text-align:right">Сумма</th><th>Оплата</th><th>Статус</th><th></th>'
      +'</tr></thead><tbody>'
      +filteredRows.map(function(s){
        var d=new Date(s.ts);
        var timeStr=d.toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
        var payStr=(s.paymentCash?'нал '+fmt(s.paymentCash):'')+(s.paymentCash&&s.paymentQr?' · ':'')+(s.paymentQr?'QR '+fmt(s.paymentQr):'')||'—';
        var statusPill=s.paid?'<span class="pill ok">оплачено</span>':'<span class="pill bad">долг '+money(s.debt)+'</span>';
        return '<tr>'
          +'<td class="sub">'+timeStr+'</td>'
          +'<td>'+esc(s.name)+' ×'+fmt(s.qty)+'</td>'
          +'<td>'+esc(s.sellerName||'—')+'</td>'
          +'<td>'+esc(s.client||'—')+'</td>'
          +'<td style="text-align:right">'+money(s.sum)+'</td>'
          +'<td class="sub">'+payStr+'</td>'
          +'<td>'+statusPill+'</td>'
          +'<td>'+(s.paid?'':'<button class="btn sec sm" onclick="salePayPrompt(\''+s.id+'\')">Погасить</button>')
            +' <button class="btn sec sm" style="color:var(--red);border-color:var(--red)" onclick="saleCancel(\''+s.id+'\')">✕</button></td>'
          +'</tr>';
      }).join('')
      +'</tbody></table></div>';
  }
  // --- ведомость по экспедитору: менеджер/директор сверяют вечером, а не выдают утром ---
  var issueHtml='';
  if(ME.role==='admin'||ME.role==='manager'){
    agentsCache=await api('/agents').catch(function(){ return []; });
    var vedBody='';
    if(!agentsCache.length){
      vedBody='<p class="sub">Нет ни одного экспедитора — добавьте пользователя с ролью «торговый / водитель» в разделе «Доступы».</p>';
    } else {
      vedBody+='<label>Экспедитор</label><select onchange="vedAgentSet(this.value)">'
        +'<option value="">— выбрать —</option>'
        +agentsCache.map(function(a){ return '<option value="'+a.id+'" '+(vedAgentId===a.id?'selected':'')+'>'+esc(a.name)+'</option>'; }).join('')
        +'</select>';
      if(vedAgentId){
        var ved=await api('/report/agent-day?userId='+vedAgentId+'&from='+from+'&to='+to).catch(function(){ return null; });
        if(!ved){
          vedBody+='<p class="sub">Не удалось загрузить ведомость.</p>';
        } else if(!ved.rows.length){
          vedBody+='<p class="sub">За выбранный период движений не было.</p>';
        } else {
          vedBody+='<div class="hl" style="margin-top:14px">Товары: взял / продал / обмен / сдал</div>'
            +'<div style="overflow-x:auto"><table class="rtable"><thead><tr><th>Товар</th><th style="text-align:right">Взял</th><th style="text-align:right">Продал</th><th style="text-align:right">Обмен (отдал/забрал)</th><th style="text-align:right">Сдал</th><th style="text-align:right">Расхожд.</th></tr></thead><tbody>'
              +ved.rows.map(function(x){
                return '<tr><td>'+esc(x.name)+'</td>'
                  +'<td style="text-align:right">'+fmt(x.issued)+'</td>'
                  +'<td style="text-align:right">'+fmt(x.sold)+'</td>'
                  +'<td style="text-align:right">'+(x.exOut||x.exBack?fmt(x.exOut)+' / '+fmt(x.exBack):'—')+'</td>'
                  +'<td style="text-align:right">'+fmt(x.returned)+'</td>'
                  +'<td style="text-align:right'+(Math.abs(x.diff)>0.01?';color:var(--red);font-weight:700':'')+'">'+(Math.abs(x.diff)>0.01?fmt(x.diff):'✓')+'</td></tr>';
              }).join('')
              +'</tbody></table></div>'
            +'<div class="hl" style="margin-top:14px">Деньги за смену</div>'
            +'<div class="li"><span class="nm">Выручка</span><span class="vl">'+money(ved.money.revenue)+'</span></div>'
            +'<div class="li"><span class="nm">Наличные</span><span class="vl">'+money(ved.money.cash)+'</span></div>'
            +'<div class="li"><span class="nm">QR/карта</span><span class="vl">'+money(ved.money.qr)+'</span></div>'
            +'<div class="li"><span class="nm">Долг</span><span class="vl"'+(ved.money.debt>0?' style="color:var(--red)"':'')+'>'+money(ved.money.debt)+'</span></div>'
            +(ved.stillOnBoard?'<p class="sub" style="margin-top:10px;color:var(--amb)">⚠ Остаток на борту ещё не сдан.</p>':'')
            +(ved.brakPending?'<p class="sub" style="color:var(--amb)">⚠ Есть несписанные возвраты по сроку годности.</p>':'');
        }
      }
    }
    issueHtml=card('agved','<b>📋 Ведомость по экспедитору</b>',vedBody);
  }

  // --- "по клиентам": группировка строится из baseRows, отфильтрованных ЕЩЁ и по товару (если выбран) —
  // так можно узнать, какой контрагент больше всего купил именно этот товар. Сама группировка по клиенту
  // фильтром "клиент" не режется — иначе в таблице остался бы один выбранный клиент. ---
  var clientMap={};
  baseRows.filter(saleProductOk).forEach(function(s){
    var k=saleClientKey(s);
    if(!clientMap[k]) clientMap[k]={client:s.client||'(без клиента)', revenue:0, debt:0, count:0, returnsQty:0, returnsCount:0};
    var lineSum=saleProductFilter?(s.lines||[]).filter(function(l){ return l.productId===saleProductFilter; }).reduce(function(a,l){ return a+l.sum; },0):s.sum;
    clientMap[k].revenue=r2f(clientMap[k].revenue+lineSum);
    clientMap[k].count++;
    if(!s.paid) clientMap[k].debt=r2f(clientMap[k].debt+s.debt);
  });
  // обмен по сроку годности (возвраты) считаем только когда явно не сузили до одного товара — обмен не привязан к productId
  if(!saleProductFilter){
    (r.byClient||[]).forEach(function(x){
      if(!x.returnsQty) return;
      var k=x.clientId||('name:'+(x.client||'(без клиента)'));
      if(clientMap[k]) { clientMap[k].returnsQty=x.returnsQty; clientMap[k].returnsCount=x.returnsCount; }
    });
  }
  var clientRows=Object.values(clientMap).filter(function(x){ return !saleSearchQ||x.client.toLowerCase().includes(saleSearchQ.toLowerCase()); })
    .sort(function(a,b){ return b.revenue-a.revenue; });

  // --- "по товару": группировка из baseRows, отфильтрованных ещё и по клиенту (если выбран) —
  // так можно узнать, что именно чаще всего берёт конкретный контрагент. ---
  var prodMap={};
  baseRows.filter(saleClientOk).forEach(function(s){
    (s.lines||[]).forEach(function(l){
      if(saleProductFilter&&l.productId!==saleProductFilter) return;
      if(!prodMap[l.productId]) prodMap[l.productId]={productId:l.productId, name:l.name, unit:l.unit, qty:0, sum:0, count:0};
      prodMap[l.productId].qty=r2f(prodMap[l.productId].qty+l.qty);
      prodMap[l.productId].sum=r2f(prodMap[l.productId].sum+l.sum);
      prodMap[l.productId].count++;
    });
  });
  var prodRows=Object.values(prodMap).filter(function(x){ return !saleSearchQ||x.name.toLowerCase().includes(saleSearchQ.toLowerCase()); })
    .sort(function(a,b){ return b.qty-a.qty; });

  var countLabel=saleBottomTab==='client'?clientRows.length+' клиентов':saleBottomTab==='product'?prodRows.length+' позиций':filteredRows.length+' продаж';

  var bottomBody='';
  if(saleBottomTab==='period'){
    bottomBody=rowsHtml;
  } else if(saleBottomTab==='client'){
    bottomBody=!clientRows.length?'<p class="sub">Нет данных за период.</p>'
      :'<div style="overflow-x:auto"><table class="rtable"><thead><tr><th>Клиент</th><th style="text-align:right">Купил</th><th style="text-align:right">Должен</th><th style="text-align:right">Продаж</th><th style="text-align:right">Возвратов</th></tr></thead><tbody>'
        +clientRows.map(function(x){
          return '<tr><td>'+esc(x.client)+'</td>'
            +'<td style="text-align:right">'+money(x.revenue)+'</td>'
            +'<td style="text-align:right'+(x.debt>0?';color:var(--red)':'')+'">'+money(x.debt)+'</td>'
            +'<td style="text-align:right">'+x.count+'</td>'
            +'<td style="text-align:right">'+(x.returnsQty?fmt(x.returnsQty)+' ('+x.returnsCount+')':'—')+'</td></tr>';
        }).join('')
        +'</tbody></table></div>';
  } else if(saleBottomTab==='product'){
    bottomBody=!prodRows.length?'<p class="sub">Нет данных за период.</p>'
      :'<div style="overflow-x:auto"><table class="rtable"><thead><tr><th>Товар</th><th style="text-align:right">Взяли</th><th style="text-align:right">Сумма</th><th style="text-align:right">Продаж</th></tr></thead><tbody>'
        +prodRows.map(function(x){
          return '<tr><td>'+esc(x.name)+'</td><td style="text-align:right">'+fmt(x.qty)+' '+x.unit+'</td><td style="text-align:right">'+money(x.sum)+'</td><td style="text-align:right">'+x.count+'</td></tr>';
        }).join('')
        +'</tbody></table></div>';
  }

  // единая белая панель: заголовок + период + фильтры + сброс/счётчик + таблица — всё в одной карточке
  var salesPanelHtml='<div class="card">'
    +'<div class="hl" style="margin-top:0">Продажи за период</div>'
    +'<div class="tabbar" style="margin-bottom:0">'
    +'<button class="'+(salePeriod===0?'on':'')+'" onclick="saleSet(0)">Сегодня</button>'
    +'<button class="'+(salePeriod===7?'on':'')+'" onclick="saleSet(7)">Неделя</button>'
    +'<button class="'+(salePeriod===30?'on':'')+'" onclick="saleSet(30)">Месяц</button>'
    +'<button class="'+(exp.saleRange?'on':'')+'" onclick="toggle(\'saleRange\')" style="width:auto;padding:8px 12px">📅</button>'
    +'</div>'
    +(exp.saleRange?'<div class="row" style="margin-top:10px">'
      +'<div><label>С</label><input type="date" value="'+from+'" onchange="saleFrom=this.value;salePeriod=-1;render()"></div>'
      +'<div><label>По</label><input type="date" value="'+to+'" onchange="saleTo=this.value;salePeriod=-1;render()"></div>'
      +'</div>':'')
    +'<div class="row" style="margin-top:10px">'
    +'<select onchange="saleBottomTab=this.value;renderInPlace()">'
      +'<option value="period" '+(saleBottomTab==='period'?'selected':'')+'>Список продаж</option>'
      +'<option value="client" '+(saleBottomTab==='client'?'selected':'')+'>По клиентам</option>'
      +'<option value="product" '+(saleBottomTab==='product'?'selected':'')+'>По товару</option>'
    +'</select>'
    +(saleBottomTab==='period'?'<select onchange="saleStatusFilter=this.value;renderInPlace()">'
      +'<option value="all" '+(saleStatusFilter==='all'?'selected':'')+'>Все статусы</option>'
      +'<option value="paid" '+(saleStatusFilter==='paid'?'selected':'')+'>Оплачено</option>'
      +'<option value="debt" '+(saleStatusFilter==='debt'?'selected':'')+'>Долг</option>'
      +'</select>':'')
    +'</div>'
    // отбор по продавцу/контрагенту/товару — работает на всех трёх видах: если сейчас смотрим
    // группировку "по клиентам", свой же фильтр "клиент" прячем (иначе он схлопнул бы таблицу
    // до одной строки), но фильтр "товар" остаётся — так видно, кто больше всего купил ИМЕННО его.
    +(r.byAgent.length||clientKeys.length||productIds.length?'<div class="row" style="margin-top:8px;flex-wrap:wrap;gap:8px">'
      +(r.byAgent.length?'<select onchange="saleAgentFilter=this.value;renderInPlace()">'+agentOpts+'</select>':'')
      +(saleBottomTab!=='client'&&clientKeys.length?'<select onchange="saleClientFilter=this.value;renderInPlace()">'+clientOpts+'</select>':'')
      +(saleBottomTab!=='product'&&productIds.length?'<select onchange="saleProductFilter=this.value;renderInPlace()">'+productOpts+'</select>':'')
    +'</div>':'')
    +'<div class="search" style="margin-top:8px"><input id="saleSearchInput" placeholder="Поиск по клиенту, блюду, продавцу..." value="'+esc(saleSearchQ)+'" oninput="saleSearchQ=this.value;renderInPlace()" autocomplete="off"></div>'
    +'<div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px">'
      +'<a href="#" onclick="salesResetFilters();return false" style="color:var(--gold);font-size:14px">Сбросить</a>'
      +'<span class="sub">'+countLabel+'</span>'
    +'</div>'
    +'<div style="margin-top:14px">'+bottomBody+'</div>'
    +'</div>';

  return '<h2>💵 Продажи</h2>'+periodHtml+cashHtml+issueHtml+sync1cHtml+salesPanelHtml;
}
window.saleSet=function(days){ salePeriod=days; var d=new Date(); saleTo=d.toISOString().slice(0,10); d.setDate(d.getDate()-days); saleFrom=d.toISOString().slice(0,10); render(); };
window.salesResetFilters=function(){ saleStatusFilter='all'; saleAgentFilter=''; saleClientFilter=''; saleProductFilter=''; saleSearchQ=''; render(); };
window.saleGoDebts=function(){ reportsType='debts'; go('reports'); };
window.vedAgentSet=function(id){ vedAgentId=id||null; renderInPlace(); };
window.salePayPrompt=async function(id){
  var v=prompt('Сумма оплаты, ₸:');
  if(v==null) return;
  var amount=+v;
  if(!(amount>0)) return toast('Введите сумму больше нуля');
  await guardedSubmit(async function(){
    try{ await api('/sales/'+id+'/pay','POST',{amount:amount}); toast('✅ Оплата зачтена'); render(); }
    catch(e){ toast(e.message); }
  });
};

// ====== Отчёты директору ======
var reportsType='sales', reportsFrom=null, reportsTo=null, reportsPeriod=0, reportsListCache=null;
async function scrReports(){
  if(!reportsListCache){ reportsListCache=await api('/reports/list').catch(function(){ return []; }); }
  var meta=reportsListCache.find(function(r){ return r.id===reportsType; })||{period:false,name:''};

  var qs='type='+reportsType;
  if(meta.period){
    var from=reportsFrom||today(), to=reportsTo||today();
    qs+='&from='+from+'&to='+to;
  }
  var rep=await api('/reports/run?'+qs).catch(function(e){ return {error:e.message}; });

  var typeButtons=reportsListCache.map(function(r){
    return '<button class="'+(r.id===reportsType?'on':'')+'" onclick="reportsSetType(\''+r.id+'\')">'+esc(r.name)+'</button>';
  }).join('');

  var periodHtml='';
  if(meta.period){
    periodHtml='<div class="tabbar" style="margin-top:10px">'
      +'<button class="'+(reportsPeriod===0?'on':'')+'" onclick="reportsSetPeriod(0)">Сегодня</button>'
      +'<button class="'+(reportsPeriod===7?'on':'')+'" onclick="reportsSetPeriod(7)">Неделя</button>'
      +'<button class="'+(reportsPeriod===30?'on':'')+'" onclick="reportsSetPeriod(30)">Месяц</button>'
      +'<button class="'+(reportsPeriod===365?'on':'')+'" onclick="reportsSetPeriod(365)">Год</button>'
      +'</div>'
      +'<div class="row" style="margin-top:10px">'
      +'<div><label>С</label><input type="date" value="'+(reportsFrom||today())+'" onchange="reportsFrom=this.value;reportsPeriod=-1;render()"></div>'
      +'<div><label>По</label><input type="date" value="'+(reportsTo||today())+'" onchange="reportsTo=this.value;reportsPeriod=-1;render()"></div>'
      +'</div>';
  }

  var contentHtml='';
  if(rep.error){
    contentHtml='<p class="sub" style="color:var(--red)">'+esc(rep.error)+'</p>';
  } else if(rep.title){
    contentHtml+='<h3 style="margin:16px 0 4px">'+esc(rep.title)+'</h3>';
    if(rep.totals&&rep.totals.length){
      contentHtml+='<div class="kpis" style="margin:6px 0 14px">'+rep.totals.map(function(t){
        return '<div><span class="l">'+esc(t.label)+'</span><span class="n">'+(t.money?money(t.value):fmt(t.value))+'</span></div>';
      }).join('')+'</div>';
    }
    (rep.tables||[]).forEach(function(t){
      if(!t.rows.length) return;
      contentHtml+='<div class="hl">'+esc(t.title)+' ('+t.rows.length+')</div>'
        +'<div style="overflow-x:auto"><table class="rtable"><thead><tr>'+t.headers.map(function(h){ return '<th>'+esc(h)+'</th>'; }).join('')+'</tr></thead><tbody>'
        +t.rows.map(function(row){ return '<tr>'+row.map(function(c){ return '<td>'+(typeof c==='number'?fmt(c):esc(c==null?'':String(c)))+'</td>'; }).join('')+'</tr>'; }).join('')
        +'</tbody></table></div>';
    });
  }

  return '<h2>📈 Отчёты</h2>'
    +'<div class="card noprint"><div class="row" style="flex-wrap:wrap;gap:6px">'+typeButtons+'</div>'+periodHtml+'</div>'
    +'<div class="card noprint" style="display:flex;gap:8px;flex-wrap:wrap">'
      +'<button class="btn sec sm" onclick="reportsDownloadCsv()">⬇️ Скачать CSV (Excel)</button>'
      +'<button class="btn sec sm" onclick="window.print()">🖨️ Печать / PDF</button>'
    +'</div>'
    +'<div id="reportPrintArea">'+contentHtml+'</div>';
}
window.reportsSetType=function(t){ reportsType=t; render(); };
window.reportsSetPeriod=function(days){ reportsPeriod=days; var d=new Date(); reportsTo=d.toISOString().slice(0,10); d.setDate(d.getDate()-days); reportsFrom=d.toISOString().slice(0,10); render(); };
window.reportsDownloadCsv=async function(){
  var meta=(reportsListCache||[]).find(function(r){ return r.id===reportsType; })||{period:false};
  var qs='type='+reportsType+'&format=csv';
  if(meta.period){ qs+='&from='+(reportsFrom||today())+'&to='+(reportsTo||today()); }
  try{
    var r=await fetch('/api'+'/reports/run?'+qs,{headers:{'x-token':TOKEN}});
    if(!r.ok) throw new Error('Ошибка скачивания');
    var blob=await r.blob();
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url; a.download=reportsType+(meta.period?('_'+(reportsFrom||today())+'_'+(reportsTo||today())):'')+'.csv';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }catch(e){ toast(e.message); }
};

window.saleCancel=async function(id){
  if(!confirm('Отменить продажу? Товар вернётся туда, откуда был продан (склад или борт экспедитора), из выручки и кассы она пропадёт. Действие необратимо (кроме как оформить продажу заново).')) return;
  await guardedSubmit(async function(){
    try{
      var r=await api('/sales/'+id+'/cancel','POST',{});
      if(r.already1c&&r.already1c.status==='created'){
        toast('⚠️ Отменено. Но в 1С уже создан документ №'+(r.already1c.docNumber||'')+' — аннулируйте его там вручную!');
      } else {
        toast('✅ Продажа отменена');
      }
      await reload(); render();
    }catch(e){ toast(e.message); }
  });
};

function agentClientBlock(){
  if(agentClientId){
    var c=agentClientsCache.find(function(x){ return x.id===agentClientId; });
    return '<label>Клиент</label><div class="li"><span class="nm">'+esc(c?c.name:'?')+(c&&c.code1c?' <span class="sub">(сверен с 1С)</span>':' <span class="sub">(новый, ещё не сверен с 1С)</span>')+'</span><span class="vl"><button class="btn sec sm" onclick="agentClientId=null;agentClientQ=\'\';renderInPlace()">✕</button></span></div>';
  }
  return '<label>Клиент (необязательно)</label>'
    +'<div class="search"><input id="agClientSearch" placeholder="Найти клиента..." value="'+esc(agentClientQ)+'" oninput="agentClientSearch(this.value)" onfocus="agentClientSearch(this.value)" autocomplete="off"></div>'
    +'<div id="agClientList"></div>';
}
window.agentClientSearch=function(v){
  agentClientQ=v;
  var el=$('#agClientList'); if(!el) return;
  var lo=v.toLowerCase();
  var res=(v?agentClientsCache.filter(function(c){ return c.name.toLowerCase().includes(lo); }):agentClientsCache.slice().sort(function(a,b){ return a.name.localeCompare(b.name,'ru'); })).slice(0,15);
  // экспедитор клиентов не заводит — только выбирает из уже существующих (заводит менеджер/директор или 1С)

function r2f(x){ return Math.round((+x||0)*100)/100; }
function agentOpTitle(s){ return s.type==='waybill' ? 'Накладная ('+s.items.length+' поз.)' : P(s.productId).name; }
window.agentSearch=function(v){ agentQ=v; renderInPlace(); };
window.agentClear=function(){ agentQ=''; renderInPlace(); };
window.agentPick=function(id){ agentSel=id; agentQty=1; var p=P(id); agentPrice=p.salePrice||0; agentClientId=null; agentClientQ=''; agentCash=0; agentQr=0; exp.agnew=true; render(); };
window.agentCalc=function(){
  agentQty=+($('#agQty')?$('#agQty').value:1)||0;
  agentPrice=+($('#agPrice')?$('#agPrice').value:0)||0;
  agentCash=+($('#agCash')?$('#agCash').value:0)||0;
  agentQr=+($('#agQr')?$('#agQr').value:0)||0;
  var total=r2f(agentQty*agentPrice);
  var paid=r2f(agentCash+agentQr);
  var debt=Math.max(0,r2f(total-paid));
  if($('#agTotal')) $('#agTotal').textContent='Итого: '+money(total);
  if($('#agDebt')) $('#agDebt').innerHTML=debt>0.001?'<span class="pill bad">долг останется: '+money(debt)+'</span>':'<span class="pill ok">оплачено полностью</span>';
};
window.agentSave=async function(){
  if(!(agentQty>0)) return toast('Введите количество');
  await guardedSubmit(async function(){
    try{
      await api('/ops','POST',{type:'sale',productId:agentSel,qty:agentQty,price:agentPrice,clientId:agentClientId,paymentCash:agentCash,paymentQr:agentQr});
      toast('✅ Продажа оформлена');
      agentSel=null; agentQty=1; agentPrice=0; agentClientId=null; agentClientQ=''; agentCash=0; agentQr=0;
      await reload(); render();
    }catch(e){ toast(e.message); }
  });
};
window.agentSaveAddress=async function(){
  if(!agentClientId) return;
  var addr=$('#agAddress')?$('#agAddress').value:'';
  try{
    await api('/clients/'+agentClientId,'PUT',{address:addr});
    var c=agentClientsCache.find(function(x){ return x.id===agentClientId; });
    if(c) c.address=addr;
  }catch(e){ toast(e.message); }
};
window.agentCartSearch=function(v){
  agentCartQ=v;

  if(!v){ el.innerHTML=''; return; }
  var res=filterList(agentStockCache,v).slice(0,10); // только то, что реально на борту
  el.innerHTML='<div class="srlist">'+(res.map(function(p){ return '<div class="sritem" onclick="agentCartPick(\''+p.productId+'\')">'+CAT(p.type).icon+' '+esc(p.name)+' <span class="sub">'+fmt(p.qty)+' '+p.unit+' · '+(p.salePrice||0)+' ₸</span></div>'; }).join('')||'<div class="sritem sub">Ничего не найдено</div>')+'</div>';
};
window.agentCartPick=function(id){
  var p=P(id);
  var onBoard=agentStockCache.find(function(x){ return x.productId===id; });
  var qty=+prompt('Количество ('+p.unit+', на борту '+(onBoard?fmt(onBoard.qty):0)+'):','1');
  if(!(qty>0)) return;
  var price=+prompt('Цена за единицу, ₸:', p.salePrice||0);
  if(!(price>=0)) return;
  agentCart.push({productId:id,name:p.name,unit:p.unit,qty:qty,price:price});
  agentCartQ=''; renderInPlace();
};
window.agentCartRemove=function(i){ agentCart.splice(i,1); renderInPlace(); };
window.agentCartCalc=function(){
  agentCash=+($('#agCash')?$('#agCash').value:0)||0;
  agentQr=+($('#agQr')?$('#agQr').value:0)||0;
  var total=agentCart.reduce(function(a,l){ return a+l.qty*l.price; },0);
  var paid=r2f(agentCash+agentQr);
  var debt=Math.max(0,r2f(total-paid));
  if($('#agCartDebt')) $('#agCartDebt').innerHTML=debt>0.001?'<span class="pill bad">долг останется: '+money(debt)+'</span>':'<span class="pill ok">оплачено полностью</span>';

window.saveSettings=async function(){
  var v=+$('#diffTh').value;
  if(!(v>0)) return toast('Введите число больше нуля');
  try{ await api('/settings','PUT',{diffThresholdPct:v}); toast('✅ Сохранено'); await reload(); render(); }
  catch(e){ toast(e.message); }
};
window.syncCopy=async function(){
  var r=await api('/1c/export?date='+(syncDate||today()));
  await navigator.clipboard.writeText(JSON.stringify(r,null,1));
  toast('JSON скопирован');
};
window.rSave=async function(){
  var q=+$('#rq').value, c=+$('#rc').value;
  if(!(q>0)||!(c>0)) return toast('Заполните количество и цену');
  try{ await api('/ops','POST',{type:'receipt',productId:$('#rp').value,qty:q,price:c}); toast('✅ Приход записан'); await reload(); render(); }
  catch(e){ toast(e.message); }
};
window.nomCheckPaste=async function(){
  nomPasteText=$('#nomPasteArea').value;
  var parsed;
  try{ parsed=JSON.parse(nomPasteText); }
  catch(e){ return toast('Это не валидный JSON'); }
  var items=Array.isArray(parsed)?parsed:parsed.items;
  if(!Array.isArray(items)) return toast('Ожидается {"items":[...]} или массив');
  try{
    await api('/1c/nomenclature-diff','POST',{items:items});
    toast('✅ Сверка выполнена'); nomPasteOpen=false; renderInPlace();
  }catch(e){ toast(e.message); }
};
window.nomApply=async function(){
  var createMissing=$('#nomCreateMissing')&&$('#nomCreateMissing').checked;
  if(!confirm(createMissing?'Обновить совпавшие наименования и создать новые позиции из 1С?':'Обновить только совпавшие наименования? (новые позиции не будут созданы)')) return;
  try{
    var nd=await api('/1c/nomenclature-diff');
    if(!nd) return toast('Нет данных сверки');
    var items=(nd.matchedDetails||[]).map(function(m){ return {code:m.code,name:m.theirName}; })
      .concat((nd.newInOneC||[]).map(function(it){ return {code:it.code,name:it.name,unit:it.unit}; }));
    var r=await api('/1c/nomenclature-apply','POST',{items:items,createMissing:createMissing});
    toast('✅ Обновлено: '+r.updated+', связано по имени: '+r.linked+', создано: '+r.created); await reload(); render();
  }catch(e){ toast(e.message); }
};
window.nomRelinkOne=async function(productId,code){
  if(!confirm('Точно привязать этому товару код «'+code+'» из 1С?\n\nЭто заменит текущий (устаревший) код на сайте. Если ошиблись — пропустите это подтверждение и поправьте код вручную в карточке товара.')) return;
  try{
    var r=await api('/1c/nomenclature-relink','POST',{items:[{productId:productId,code:code}]});
    toast('✅ Код обновлён'); await reload(); render();
  }catch(e){ toast(e.message); }

window.clientsApply=async function(){
  var createMissing=$('#clCreateMissing')&&$('#clCreateMissing').checked;
  if(!confirm(createMissing?'Обновить совпавшие имена и создать новых клиентов из 1С?':'Обновить только совпавшие имена? (новые клиенты не будут созданы)')) return;
  try{
    var cd=await api('/1c/clients-diff');
    if(!cd) return toast('Нет данных сверки');
    var items=(cd.matchedDetails||[]).map(function(m){ return {code:m.code,name:m.theirName}; })
      .concat((cd.newInOneC||[]).map(function(it){ return {code:it.code,name:it.name}; }));
    var r=await api('/1c/clients-apply','POST',{items:items,createMissing:createMissing});
    toast('✅ Обновлено: '+r.updated+', создано: '+r.created+', связано по имени: '+r.linked); await reload(); render();
  }catch(e){ toast(e.message); }
};
