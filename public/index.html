<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>SKY MEAL</title>
<style>
:root{--bg:#F5F3F0;--card:#FFFFFF;--ink:#1C1917;--mut:#79716B;--line:#E7E3DE;--gold:#C9A35C;--goldink:#1C1917;--acc:#15803D;--accbg:#EAF5EE;--red:#DC2626;--redbg:#FCEBEA;--amb:#B45309;--ambbg:#FBF3E6;--blu:#1D4ED8;--blubg:#DBEAFE}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;padding-bottom:76px}
header{position:sticky;top:0;background:var(--bg);padding:12px 16px 8px;display:flex;justify-content:space-between;align-items:center;z-index:5;border-bottom:1px solid var(--line)}
header h1{font-size:17px;font-weight:600}
header .who{font-size:12px;color:var(--mut)}
main{padding:12px 12px 20px;max-width:680px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.tap{cursor:pointer}.tap:active{opacity:.85}
.cbody{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:12px;background:var(--gold);color:var(--goldink);font-size:16px;font-weight:700;cursor:pointer}
.btn:active{transform:scale(.98)}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.grn{color:#fff}
.btn.red{color:#fff}
.btn.grn{background:var(--acc)}
.btn.red{background:var(--red)}
.btn:disabled{opacity:.35}
.sm{font-size:13px;padding:8px 12px;width:auto;display:inline-block}
input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:var(--card);color:var(--ink)}
input.big{font-size:26px;font-weight:600;text-align:center}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
.row{display:flex;gap:8px}.row>*{flex:1}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600}
.ok{background:var(--accbg);color:var(--acc)}.bad{background:var(--redbg);color:var(--red)}.warn{background:var(--ambbg);color:var(--amb)}.info{background:var(--blubg);color:var(--blu)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:5}
nav button{flex:1;padding:12px 2px;border:none;background:none;font-size:11px;color:var(--mut);cursor:pointer;line-height:1.2}
nav button.on{color:var(--gold);font-weight:700}
nav button .ic{display:none}
.li{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:8px}
.li:last-child{border:none}
.li .nm{flex:1;font-size:14px}
.li .vl{font-weight:600;font-size:14px;white-space:nowrap}
.sub{font-size:11px;color:var(--mut)}
h2{font-size:14px;font-weight:600;margin:4px 0 10px}
.step{display:flex;align-items:center;gap:8px}
.step button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:20px;cursor:pointer}
.step span{min-width:40px;text-align:center;font-size:19px;font-weight:600}
.toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--card);color:var(--ink);border:1px solid var(--gold);padding:10px 18px;border-radius:99px;font-size:13px;z-index:99;opacity:0;transition:.25s;max-width:92%;text-align:center;box-shadow:0 4px 20px rgba(28,25,23,.12)}
.toast.show{opacity:1}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:280px;margin:16px auto}
.pinpad button{padding:17px;font-size:21px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer}
.dots{text-align:center;font-size:28px;letter-spacing:10px;min-height:36px}
.search{position:relative;margin-bottom:10px}
.search input{padding-left:36px}
.search::before{content:'🔍';position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px}
.search .clr{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:15px;color:var(--mut);cursor:pointer;display:none;padding:4px}
.srlist{background:var(--card);border:1px solid var(--line);border-radius:10px;max-height:260px;overflow-y:auto;margin-top:4px}
.worklist{max-height:320px;overflow-y:auto;margin-bottom:8px}
.nomlist{max-height:420px;overflow-y:auto;margin-bottom:8px}
.stocklist{max-height:420px;overflow-y:auto;margin-bottom:8px}
.sritem{padding:12px 14px;cursor:pointer;border-bottom:1px solid var(--line);font-size:14px}
.sritem:last-child{border:none}
.sritem:active{background:var(--bg)}
.tabbar{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px}
.tabbar button{padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:13px;white-space:nowrap;cursor:pointer}
.tabbar button.on{background:var(--gold);color:var(--goldink);border-color:var(--gold);font-weight:700}
.chev{font-size:11px;color:var(--mut);transition:transform .2s;display:inline-block;margin-right:4px}
.chev.open{transform:rotate(90deg)}
.done{background:var(--accbg);border:1px solid #BBF7D0;border-radius:14px;padding:14px;margin-bottom:10px;text-align:center}
.hl{font-size:11px;color:var(--gold);margin:14px 0 5px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px}
.kpis{display:flex;text-align:center;padding:2px 0}
.kpis>div{flex:1}
.kpis .n{display:block;font-size:17px;font-weight:700;margin-top:2px}
.kpis .l{font-size:11px;color:var(--mut)}
.datehead{font-size:11px;color:var(--mut);font-weight:600;margin:12px 0 4px;padding-left:2px}
.alertbar{display:flex;justify-content:space-between;align-items:center;background:var(--ambbg);color:var(--amb);border-radius:12px;padding:10px 14px;margin-bottom:10px;font-size:13px}
.rtable{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border-radius:12px;overflow:hidden;margin-bottom:14px}
.rtable th{text-align:left;padding:8px 10px;background:var(--bg);color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.rtable td{padding:7px 10px;border-top:1px solid var(--line);white-space:nowrap}
@media print{
  nav,header,.noprint{display:none!important}
  main{padding:0!important}
  body{background:#fff!important}
  .card{box-shadow:none!important;border:1px solid #ddd}
}
h2{letter-spacing:.3px}
header img.lg{height:26px;display:block}
.logochip{display:inline-flex;align-items:center;background:#1C1917;padding:6px 16px;border-radius:10px;line-height:0}
.loginlogo{display:block;width:220px}
.loginchip{display:flex;justify-content:center;width:220px;padding:20px 24px;border-radius:16px;margin:0 auto 26px}
.neg{color:var(--red)}
/* ===== ПК: меню слева, контент по центру ===== */
@media(min-width:900px){
  body{padding-bottom:20px}
  header{position:fixed;top:0;left:0;right:0;padding:16px 24px 12px;height:56px;z-index:6}
  nav{top:56px;bottom:0;left:0;right:auto;width:220px;flex-direction:column;border-top:none;border-right:1px solid var(--line);justify-content:flex-start;overflow-y:auto}
  nav button{flex:0 0 auto;width:100%;text-align:left;font-size:15px;padding:14px 22px;border-left:3px solid transparent}
  nav button.on{border-left-color:var(--gold);background:var(--bg)}
  main{margin-left:220px;margin-top:56px;max-width:860px;padding:24px 32px}
  .card{padding:18px}
  input,select{font-size:15px}
  .btn{max-width:420px;margin-left:auto;margin-right:auto}
  .tabbar button{font-size:14px;padding:9px 18px}
}
/* ===== телефон: крупные кнопки, всё влезает ===== */
@media(max-width:899px){
  nav{padding-bottom:env(safe-area-inset-bottom)}
  nav button{font-size:12px;font-weight:600;padding:15px 1px 17px}
  main{padding:12px 10px 20px}
  body{padding-bottom:90px}
  .worklist,.nomlist{max-height:44vh}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<script>
'use strict';
var TOKEN = sessionStorage.getItem('tok') || '';
var ME = JSON.parse(sessionStorage.getItem('me') || 'null');
var D = { products: [], stock: {}, sklads: [], alerts: [] };
var screen = sessionStorage.getItem('screen') || 'work';
var pin = '', pickedUser = null;
var exp = {}, busy = false;
var wSel = null, wDone = null, wQ = '';
var pCnt = {}, pDate = null, pFrom = null, pTo = null;
var stockTabDept = '', nomTab = 'raw', recFilter = 'all';
var outFrom = null, outTo = null;
var lossFrom = null, lossTo = null;
var syncDate = null, rcptOpen = false;
var woItems = [], woQ = '';
var editRecipe = [];
var nomPasteOpen = false, nomPasteText = '';
var stPasteOpen = false, stPasteText = '';
var clPasteOpen = false, clPasteText = '';
var salesPasteOpen = false, salesPasteText = '';
var payPasteOpen = false, payPasteText = '';
var specsPasteOpen = false, specsPasteText = '';
var agentQ = '', agentSel = null, agentQty = 1, agentPrice = 0;
var agentClientId = null, agentClientQ = '', agentClientsCache = [];
var agentMode = 'quick', agentCart = [], agentCartQ = '';
var agentCash = 0, agentQr = 0, agentFrom = null, agentTo = null;
var newUserRole = 'agent';

var $ = function(s){ return document.querySelector(s); };
var app = $('#app');
var fmt = function(n){ return (Math.round((+n||0)*100)/100).toLocaleString('ru-RU'); };
var money = function(n){ return fmt(n) + ' ₸'; };
var today = function(){ return new Date().toISOString().slice(0,10); };
var P = function(id){ return D.products.find(function(p){ return p.id===id; }) || {name:'?',unit:'',recipe:[],type:'raw',department:'Кухня / Заготовки'}; };
var SK = function(id){ return (D.sklads||[]).find(function(s){ return s.id===id; }) || {name:id||'—'}; };
var esc = function(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
var ROLE = {cook:'повар',cook_prep:'повар заготовок',cook_sand:'повар сэндвичей',cook_hot:'повар горячего',cook_baker:'пекарь',cook_pastry:'кондитер',cook_head:'главный повар',tech:'менеджер',admin:'директор',agent:'торговый / водитель'};
var isCook = function(r){ return r==='cook'||r.startsWith('cook_'); };
var hasRecipe = function(p){ return p&&p.recipe&&p.recipe.length>0; };
var CATS = [
  {id:'raw',icon:'🛒',name:'Продукты'},
  {id:'process',icon:'⚖️',name:'Выработка'},
  {id:'semi',icon:'🧊',name:'Полуфабрикаты'},
  {id:'bread',icon:'🍞',name:'Хлеб и тесто'},
  {id:'dish',icon:'🥪',name:'Готовые блюда'}
];
var CAT = function(id){ return CATS.find(function(c){ return c.id===id; }) || {icon:'📦',name:id||''}; };
// Цеха — один физический склад на все товары (совпадает с 1С), цех — просто метка "кто с этим товаром работает"
var DEPARTMENTS = ['Кухня / Заготовки','Сэндвичи','Горячее','Хлеб и тесто','Кондитерка','Готовая продукция'];
var UNITS = ['кг','г','шт','л','мл'];
var ST = {
  draft:'<span class="pill warn">✏️ черновик</span>',
  submitted:'<span class="pill info">📨 у менеджера</span>',
  approved:'<span class="pill ok">✅ утверждена</span>'
};

function toast(msg,ms){ var t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){ t.classList.remove('show'); },ms||2400); }
async function api(path,method,body){
  var r=await fetch('/api'+path,{method:method||'GET',headers:{'Content-Type':'application/json','x-token':TOKEN},body:body?JSON.stringify(body):undefined});
  var j=await r.json();
  if(r.status===401&&ME){logout();throw new Error('Сессия истекла');}
  if(!r.ok) throw new Error(j.error||'Ошибка');
  return j;
}
function logout(){ TOKEN='';ME=null;sessionStorage.clear();pickedUser=null;pin='';render(); }
async function reload(){ D=await api('/bootstrap'); }
function opTime(o){ return new Date(o.ts).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}); }
function filterList(list,q){ var lo=q.toLowerCase(); return lo?list.filter(function(p){ return p.name.toLowerCase().includes(lo); }):list; }

// свернуть/развернуть
window.toggle=function(key){ exp[key]=!exp[key]; renderInPlace(); };
function card(key,hdr,body){
  var open=exp[key];
  return '<div class="card tap" onclick="toggle(\''+key+'\')">'
    +'<div style="display:flex;justify-content:space-between;align-items:center">'+hdr+'<span class="chev '+(open?'open':'')+'">▶</span></div>'
    +(open?'<div class="cbody" onclick="event.stopPropagation()">'+body+'</div>':'')
    +'</div>';
}

// ====== ВХОД ======
async function renderLogin(){
  app.innerHTML='<main style="padding-top:60px;max-width:400px;margin:0 auto">'
    +'<span class="logochip loginchip"><img src="/logo.png" alt="SKY MEAL" class="loginlogo"></span>'
    +'<div class="card" style="padding:24px">'
    +'<label style="font-size:14px">Роль</label>'
    +'<select id="logincat" style="font-size:17px;padding:14px">'
    +'<option value="cook">Повар</option>'
    +'<option value="tech">Менеджер</option>'
    +'<option value="agent">Торговый / водитель</option>'
    +'<option value="admin">Директор</option>'
    +'</select>'
    +'<label style="font-size:14px">Пароль</label>'
    +'<input id="loginpin" type="password" inputmode="numeric" placeholder="****" style="font-size:22px;padding:14px;text-align:center;letter-spacing:6px" onkeydown="if(event.key===\'Enter\')doLogin()">'
    +'<div style="height:20px"></div>'
    +'<button class="btn" onclick="doLogin()">Войти</button>'
    +'</div></main>';
}
window.doLogin=async function(){
  var cat=$('#logincat').value, pinVal=$('#loginpin').value;
  if(!pinVal) return toast('Введите пароль');
  try{
    var r=await api('/login','POST',{category:cat,pin:pinVal});
    TOKEN=r.token; ME=r.user;
    sessionStorage.setItem('tok',TOKEN); sessionStorage.setItem('me',JSON.stringify(ME));
    screen=isCook(ME.role)?'work':ME.role==='agent'?'agent':ME.role==='tech'?'nom':'cost';
    await reload(); render();
  }catch(e){ toast(e.message); $('#loginpin').value=''; }
};

// ====== КАРКАС ======
var NAVS={
  cook:      [['work','⚖️','Обработка'],['prod','🥪','Выпуск'],['nom','🏷️','Продукты'],['stock','📋 ','Остатки']],
  cook_prep: [['work','⚖️','Обработка'],['prod','🥪','Выпуск'],['nom','🏷️','Продукты'],['stock','📋 ','Остатки']],
  cook_sand: [['work','⚖️','Обработка'],['prod','🥪','Выпуск'],['nom','🏷️','Продукты'],['stock','📋 ','Остатки']],
  cook_hot:  [['work','⚖️','Обработка'],['prod','🥪','Выпуск'],['nom','🏷️','Продукты'],['stock','📋 ','Остатки']],
  cook_baker:[['work','⚖️','Обработка'],['prod','🥪','Выпуск'],['nom','🏷️','Продукты'],['stock','📋 ','Остатки']],
  cook_pastry:[['work','⚖️','Обработка'],['prod','🥪','Выпуск'],['nom','🏷️','Продукты'],['stock','📋 ','Остатки']],
  cook_head: [['work','⚖️','Обработка'],['prod','🥪','Выпуск'],['nom','🏷️','Продукты'],['stock','📋 ','Остатки']],
  agent:     [['agent','🚚','Продажи']],
  tech:      [['orders','📝','Заказы'],['nom','🏷️','Продукты'],['wo','🧂','Специи'],['output','📊',  'Выработка'],['stock','📋','Остатки'],['reports','📈','Отчёты']],
  admin:     [['orders','📝','Заказы'],['sales','💵','Продажи'],['cost','💰','Калькуляция'],['output','📊','Выработка'],['stock','📋','Остатки'],['losses','📉','Потери'],['reports','📈','Отчёты'],['sync','🔄','1С'],['users','🔒','Доступы']]
};
function shell(inner){
  var navs=NAVS[ME.role]||NAVS.admin;
  var navHtml=navs.map(function(n){
    return '<button class="'+(screen===n[0]?'on':'')+'" onclick="go(\''+n[0]+'\')">'
      +'<span class="ic">'+n[1]+'</span>'+n[2]+'</button>';
  }).join('');
  var alertsHtml='';
  if((ME.role==='admin'||ME.role==='tech')&&D.alerts&&D.alerts.length){
    alertsHtml='<div class="card" style="border-color:var(--amb);background:var(--ambbg)">'
      +'<div style="display:flex;justify-content:space-between;align-items:center;gap:8px">'
      +'<b>⚠️ Уведомления ('+D.alerts.length+')</b>'
      +'<button class="btn sec sm" onclick="alertsRead()">Прочитано</button></div>'
      +D.alerts.slice(0,5).map(function(a){ return '<div class="sub" style="margin-top:6px">'+esc(a.msg)+'</div>'; }).join('')
      +'</div>';
  }
  app.innerHTML='<header><span class="logochip"><img src="/logo.png" alt="SKY MEAL" class="lg"></span><span class="who">'+esc(ME.name)+' · '+(ROLE[ME.role]||ME.role)+' · <a href="#" onclick="logout();return false" style="color:var(--mut)">выйти</a></span></header>'
    +'<main id="m">'+alertsHtml+inner+'</main>'
    +'<nav>'+navHtml+'</nav>';
}
window.alertsRead=async function(){
  try{ await api('/alerts/read','POST'); await reload(); render(); }
  catch(e){ toast(e.message); }
};
window.go=async function(s){ screen=s;sessionStorage.setItem('screen',s);wSel=null;wDone=null;exp={};await reload();render(); };
window.logout=logout;

function renderInPlace(){
  var fn=SCREENS[screen]; if(!fn) return;
  var out=fn();
  if(out instanceof Promise) out.then(function(h){ if($('#m')) $('#m').innerHTML=h; }).catch(function(e){ if($('#m')) $('#m').innerHTML='<p class="sub">'+esc(e.message)+'</p>'; });
  else if($('#m')) $('#m').innerHTML=out;
}

// ====== ПОВАР: ОБРАБОТКА ======
async function scrWork(){
  var procs=D.products.filter(function(p){ return p.type==='process'&&p.sourceId; });
  var filtered=filterList(procs,wQ);
  var myOps=await api('/ops?date='+today()+'&type=processing&mine=1');
  var hist='';
  if(myOps.length){
    hist='<div class="hl">Обработано сегодня:</div>'
      +myOps.slice().reverse().map(function(o){
        return card('hw'+o.id,
          '<span><b>'+esc(P(o.rawId).name)+'</b> → '+esc(P(o.semiId).name)+' <span class="sub">'+opTime(o)+'</span></span>',
          fmt(o.qtyBefore)+' → '+fmt(o.qtyAfter)+' '+P(o.rawId).unit+' · потери '+o.lossPct+'%'
        );
      }).join('');
  }
  if(wDone){
    var d=wDone; wDone=null;
    return '<div class="done"><div style="font-size:34px">✅</div>'
      +'<b>Записано!</b><br>'+esc(P(d.rawId).name)+': '+fmt(d.qtyBefore)+' → '+fmt(d.qtyAfter)+' '+P(d.rawId).unit+'<br>'
      +'<span class="sub">Потери '+d.lossPct+'% · '+opTime(d)+'</span></div>'
      +'<button class="btn" onclick="wSel=null;wQ=\'\';render()">Обработать ещё</button>'+hist;
  }
  if(!wSel){
    var listHtml=procs.map(function(s){
      var raw=P(s.sourceId);
      return '<div class="card tap work-item" data-name="'+esc((raw.name+' '+s.name).toLowerCase())+'" onclick="wPick(\''+s.id+'\')"><b>'+esc(raw.name)+'</b> → '+esc(s.name)+'</div>';
    }).join('') || '<p class="sub">Пока нет пар для обработки.</p>';
   return '<div class="search"><input id="workSearch" placeholder="Найти продукт для обработки..." oninput="wSearch(this.value)" autocomplete="off"><span class="clr" onclick="wClear()">✕</span></div>'
      +'<div class="worklist">'+listHtml+'</div>'+hist;
  }
  var s=P(wSel), raw=P(s.sourceId);
  return '<button class="btn sec sm" onclick="wSel=null;render()">← Назад</button>'
    +'<div class="card" style="margin-top:10px">'
    +'<span class="pill ok">'+esc(raw.name)+' → '+esc(s.name)+'</span>'
    +'<label>Вес ДО обработки, '+raw.unit+'</label>'
    +'<input class="big" id="wb" type="number" step="0.01" inputmode="decimal" oninput="wCalc()">'
    +'<label>Вес ПОСЛЕ обработки, '+raw.unit+'</label>'
    +'<input class="big" id="wa" type="number" step="0.01" inputmode="decimal" oninput="wCalc()">'
    +'<div id="wloss" style="margin:12px 0;text-align:center;font-size:15px;color:var(--mut)">Введите оба веса</div>'
    +'<button class="btn" id="wgo" disabled onclick="wSave()">Записать</button>'
    +'</div>'+hist;
}
window.wPick=function(id){ wSel=id; history.pushState({},''); render(); };
window.wSearch=function(v){
  filterDom(v,'work-item');
  var c=document.querySelector('.search .clr');
  if(c) c.style.display=v?'block':'none';
};
window.wClear=function(){
  var i=$('#workSearch');
  if(i) i.value='';
  wSearch('');
  if(i) i.focus();
};
  window.wCalc=function(){
  var b=+$('#wb').value, a=+$('#wa').value, el=$('#wloss'), btn=$('#wgo');
  if(b>0&&a>0&&a<=b){ el.innerHTML='Потери: <b>'+((1-a/b)*100).toFixed(1)+'%</b>'; btn.disabled=false; }
  else if(a>b){ el.textContent='Вес ПОСЛЕ больше ДО — проверьте'; btn.disabled=true; }
  else { el.textContent='Введите оба веса'; btn.disabled=true; }
};
window.wSave=async function(){
  if(busy) return;
  var s=P(wSel), b=+$('#wb').value, a=+$('#wa').value;
  if(!s.sourceId){ toast('У продукта не указан исходный — настройте в Продуктах'); return; }
  try{
    busy=true; $('#wgo').disabled=true;
    var recent=await api('/ops?date='+today()+'&type=processing&mine=1');
    var dup=recent.find(function(o){ return o.semiId===wSel&&(Date.now()-new Date(o.ts))<10*60*1000; });
    if(dup&&!confirm('Вы уже записывали «'+P(dup.rawId).name+'» в '+opTime(dup)+'.\n\nЭто НОВАЯ партия?')){
      busy=false; if($('#wgo')) $('#wgo').disabled=false; return;
    }
    var r=await api('/ops','POST',{type:'processing',rawId:s.sourceId,semiId:wSel,qtyBefore:b,qtyAfter:a});
    wDone=r; wSel=null; render();
  }catch(e){ toast(e.message); if($('#wgo')) $('#wgo').disabled=false; }
  busy=false;
};

// ====== ПОВАР: ВЫПУСК ======
async function scrProd(){
  var approved=D.products.filter(function(p){ return hasRecipe(p)&&p.recipeStatus==='approved'; });
  var from=pFrom||today(), to=pTo||today();
  var dayOps=await api('/ops?from='+from+'&to='+to+'&type=production');
  var plan=await api('/report/plan');
  var planMap={}; plan.forEach(function(g){ planMap[g.productId]=g; });
  var anyCnt=Object.values(pCnt).some(function(v){ return v>0; });
var listHtml=approved.map(function(d){
    var g=planMap[d.id];
    var planLine=g?'<div class="sub">план: <b>'+fmt(g.planQty)+'</b> · сделано: <b>'+fmt(g.factQty)+'</b> · осталось: <b>'+fmt(Math.max(0,g.planQty-g.factQty))+'</b></div>':'';
    return '<div class="li prod-item" data-name="'+esc(d.name.toLowerCase())+'" style="align-items:flex-start">'
      +'<span class="nm">'+CAT(d.type).icon+' '+esc(d.name)+planLine+'</span>'
      +'<span class="step">'
      +'<button onclick="pStep(\''+d.id+'\',-1)">−</button>'
      +'<input type="number" inputmode="numeric" min="0" value="'+(pCnt[d.id]||0)+'" style="width:52px;text-align:center;border:1px solid var(--line);border-radius:8px;padding:9px 2px;font-size:19px;font-weight:600" onfocus="this.select()" onchange="pSetCnt(\''+d.id+'\',this.value)">'
      +'<button onclick="pStep(\''+d.id+'\',1)">+</button>'
      +'</span></div>';
  }).join('');
  var histHtml=dayOps.length ? dayOps.slice().reverse().map(function(o){
    var ing=P(o.productId).recipe.map(function(it){ return '<div class="sub">'+esc(P(it.productId).name)+': '+fmt(it.qty)+' '+P(it.productId).unit+'</div>'; }).join('');
    return card('ph'+o.id,
      '<span><b>'+CAT(P(o.productId).type).icon+' '+esc(P(o.productId).name)+' × '+fmt(o.count)+'</b> <span class="sub">'+opTime(o)+'</span></span>',
      ing
    );
}).join('') : '<p class="sub">За этот период выпуска не было.</p>';
  return '<h2>Выпуск готовой продукции</h2>'
    +'<div class="search"><input id="prodSearch" placeholder="Найти блюдо..." oninput="pSearch(this.value)" autocomplete="off"><span class="clr" onclick="pClear()">✕</span></div>'
    +(approved.length
      ? '<div class="card">'+listHtml+'</div><button class="btn" '+(anyCnt?'':'disabled')+' onclick="pSave()">Записать выпуск</button>'
      : '<div class="card"><p class="sub">Нет утверждённых рецептур. Проверьте раздел «Рецептуры».</p></div>')
    +'<div class="hl">История выпуска</div>'
    +'<div class="row"><div><label>С</label><input type="date" value="'+from+'" onchange="pFrom=this.value;render()"></div>'
    +'<div><label>По</label><input type="date" value="'+to+'" onchange="pTo=this.value;render()"></div></div>'
    +'<button class="btn sec sm" onclick="pSet(0)">Сегодня</button> '
    +'<button class="btn sec sm" onclick="pSet(7)">Неделя</button> '
    +'<button class="btn sec sm" onclick="pSet(30)">Месяц</button>'
    +'<div style="height:8px"></div>'
    +histHtml;
}
window.pSet=function(days){ var d=new Date(); pTo=d.toISOString().slice(0,10); d.setDate(d.getDate()-days); pFrom=d.toISOString().slice(0,10); render(); };
window.pStep=function(id,d){ pCnt[id]=Math.max(0,(pCnt[id]||0)+d); renderInPlace(); };
window.pSetCnt=function(id,v){
  pCnt[id]=Math.max(0,parseInt(v,10)||0);
  renderInPlace();
};
  window.pSearch=function(v){
  filterDom(v,'prod-item');
  var c=document.querySelectorAll('.search .clr')[document.querySelectorAll('.search .clr').length-1];
  if(c) c.style.display=v?'block':'none';
};
window.pClear=function(){
  var i=$('#prodSearch');
  if(i) i.value='';
  pSearch('');
  if(i) i.focus();
};
  window.pSave=async function(){
  if(busy) return; busy=true;
  try{
    var entries=Object.entries(pCnt).filter(function(e){ return e[1]>0; });
    for(var i=0;i<entries.length;i++) await api('/ops','POST',{type:'production',productId:entries[i][0],count:entries[i][1]});
    toast('✅ Выпуск записан'); pCnt={}; render();
  }catch(e){ toast(e.message); }
  busy=false;
};

// ====== ОБЩИЕ ФУНКЦИИ РЕЦЕПТУР ======
function recRows(p,depth){
  depth=depth||0;
  return (p.recipe||[]).map(function(it){
    var c=P(it.productId), nested=hasRecipe(c), key='ri'+p.id+it.productId;
    var inner='';
    if(nested&&exp[key]) inner='<div style="background:var(--bg);border-radius:8px;padding:6px 10px;margin-left:'+(depth*14)+'px">'+recRows(c,depth+1)+'</div>';
    return '<div class="li" style="padding-left:'+(depth*14)+'px"'+(nested?' onclick="toggle(\''+key+'\');event.stopPropagation()"':'')+' >'
      +'<span class="nm">'+(nested?'<span class="chev '+(exp[key]?'open':'')+'" style="display:inline">▶</span> ':'')+esc(c.name)
      +(nested?' <span class="pill ok" style="font-size:10px">рецепт</span>':'')
      +(it.noteRaw?'<div class="sub">Excel: '+esc(it.noteRaw)+'/'+esc(it.noteDone)+'</div>':'')
      +'</span><span class="vl">'+fmt(it.qty)+' '+c.unit+'</span></div>'+inner;
  }).join('');
}
function canEdit(p){
  var st=p.recipeStatus||'draft';
  if(ME.role==='admin') return true;
  if(st==='approved') return false;
  if(st==='submitted') return ME.role==='tech';
  return true;
}
window.recStatus=async function(id,action,msg){
  if(!confirm(msg)) return;
  try{ await api('/recipes/'+id+'/status','POST',{action:action}); toast('Готово'); await reload(); render(); }
  catch(e){ toast(e.message); }
};
// ====== ПРОДУКТЫ (единый экран: карточка + состав + статус) ======
function scrNom(){
  var list=D.products.filter(function(p){ return p.type===nomTab; });
  var tabsHtml='<div class="tabbar">'+CATS.map(function(c){ return '<button class="'+(nomTab===c.id?'on':'')+'" onclick="nomTab=\''+c.id+'\';renderInPlace()">'+c.icon+' '+c.name+'</button>'; }).join('')+'</div>';
  var searchHtml='<div class="search"><input id="nomSearch" placeholder="Найти..." oninput="nSearch(this.value)" autocomplete="off"><span class="clr" onclick="nClear()">✕</span></div>';
  var items=list.map(function(p){
    var st=p.recipeStatus||'draft';
    var stPill=hasRecipe(p)?' '+ST[st]:'';
    var lockIco=hasRecipe(p)&&!canEdit(p)?' 🔒':'';
    var recHtml=hasRecipe(p)?'<div style="background:var(--bg);border-radius:8px;padding:8px 10px">'+recRows(p)+'</div>':'<p class="sub">Состав не заполнен — нажмите ✎ чтобы добавить</p>';
    var actBtn='';
    if(hasRecipe(p)){
      if(st==='draft'&&isCook(ME.role)) actBtn='<button class="btn grn" style="margin-top:8px" onclick="event.stopPropagation();recStatus(\''+p.id+'\',\'submit\',\'Передать менеджеру?\')">Передать менеджеру →</button>';
      if(st!=='approved'&&ME.role==='tech') actBtn='<button class="btn grn" style="margin-top:8px" onclick="event.stopPropagation();recStatus(\''+p.id+'\',\'approve\',\'Утвердить?\')">✅ Утвердить</button>';
    }
    var info='';
    if(p.code1c) info+='<div class="sub">код 1С: '+esc(p.code1c)+'</div>';
    if(p.sourceId&&p.sourceId!==p.id) info+='<div class="sub">выработка из: '+esc(P(p.sourceId).name)+'</div>';
    var editBtn=(!hasRecipe(p)||canEdit(p))?'<button class="btn sec sm" onclick="event.stopPropagation();nomEdit(\''+p.id+'\')">✎</button>':'';
    return '<div class="nom-item" data-name="'+esc(p.name.toLowerCase())+'">'+card('n'+p.id,
      '<span style="flex:1"><b>'+esc(p.name)+'</b>'+stPill+lockIco+info+'</span>'+editBtn,
      recHtml+actBtn
    )+'</div>';
  }).join('') || '<p class="sub">В этой категории пусто.</p>';
  return tabsHtml+searchHtml+'<div class="nomlist">'+items+'</div>'+'<button class="btn" onclick="nomEdit(null)">+ Добавить позицию</button>';
}
window.nomEdit=function(id){
  var p=id?P(id):{name:'',type:nomTab,unit:nomTab==='dish'?'шт':'кг',sourceId:'',code1c:'',department:nomTab==='dish'?'Готовая продукция':(nomTab==='bread'?'Хлеб и тесто':'Кухня / Заготовки'),recipe:[]};
  editRecipe=JSON.parse(JSON.stringify(p.recipe||[]));
  drawNomEdit(id,p);
};
function drawNomEdit(id,p){
  var procs=D.products.filter(function(x){ return x.type==='raw'&&x.id!==id; });
  var locked=id&&hasRecipe(p)&&(p.recipeStatus==='approved')&&ME.role!=='admin';
  var catOpts=CATS.map(function(c){ return '<option value="'+c.id+'" '+(p.type===c.id?'selected':'')+'>'+c.icon+' '+c.name+'</option>'; }).join('');
  var unitOpts=UNITS.map(function(u){ return '<option '+(p.unit===u?'selected':'')+'>'+u+'</option>'; }).join('');
  var deptOpts=DEPARTMENTS.map(function(d){ return '<option value="'+esc(d)+'" '+(p.department===d?'selected':'')+'>'+esc(d)+'</option>'; }).join('');
  var srcOpts='<option value="">— не используется —</option>'+procs.map(function(r){ return '<option value="'+r.id+'" '+(p.sourceId===r.id?'selected':'')+'>'+esc(r.name)+'</option>'; }).join('');
  var rows=editRecipe.map(function(it,i){
    var c=P(it.productId);
    return '<div class="li"><span class="nm">'+esc(c.name)+' <span class="sub">'+c.unit+'</span></span>'
      +'<input type="number" step="0.1" inputmode="decimal" value="'+it.qty+'" data-rq="'+i+'" style="width:88px;text-align:center" onfocus="this.select()">'
      +'<button class="btn sec sm" onclick="nomDelRow('+i+',\''+(id||'')+'\')">✕</button></div>';
  }).join('');
  $('#m').innerHTML='<button class="btn sec sm" onclick="render()">← Назад</button>'
    +'<div class="card" style="margin-top:10px">'
    +(locked?'<p class="pill ok" style="margin-bottom:8px">✅ Рецептура утверждена — изменения через директора</p>':'')
    +'<label>Наименование</label><input id="gn" value="'+esc(p.name)+'" '+(locked?'disabled':'')+' >'
    +'<div class="row"><div><label>Категория</label><select id="gt">'+catOpts+'</select></div>'
    +'<div><label>Единица</label><select id="gu">'+unitOpts+'</select></div></div>'
+'<label>Цех</label><select id="gdept">'+deptOpts+'</select>'
    +(isCook(ME.role)?'':'<label>Исходный продукт (только для Выработки ⚖️ — пары «сырьё → обработанное»)</label><select id="gs">'+srcOpts+'</select>')
    +(isCook(ME.role)?'':'<label>Код в 1С (заполняет менеджер)</label><input id="gc" value="'+esc(p.code1c||'')+'">')
    +'</div>'
+(p.type==='process'
      ? '<div class="card"><p class="sub">Этот продукт — результат обработки (⚖️ Выработка). Остаток появится автоматически, когда повар взвесит вес до/после на экране «Обработка». Рецептура здесь не нужна.</p></div>'
      : '<div class="card"><h2>Состав (рецептура)</h2>'
        +(locked?'<p class="sub">Заблокировано после утверждения</p>':'')
        +'<div id="recrows">'+rows+'</div>'
        +(!locked?'<div class="search" style="margin-top:10px"><input id="recSearch" placeholder="Найти и добавить ингредиент..." oninput="nomRecSearch(this.value,\''+(id||'')+'\')" autocomplete="off"><span class="clr" onclick="nomRecClear(\''+(id||'')+'\')">✕</span></div><div id="recaddlist"></div>':'')
        +'</div>')
    +'<button class="btn" onclick="nomSave(\''+(id||'')+'\')">Сохранить</button>';
}
window.nomRecSearch=function(q,id){
  var el=$('#recaddlist'); if(!el) return;
  var c=$('.search .clr');
  if(c) c.style.display=q?'block':'none';
  if(!q){ el.innerHTML=''; return; }
  var res=filterList(D.products.filter(function(x){ return x.id!==id; }),q).slice(0,8);
  el.innerHTML='<div class="srlist">'+(res.map(function(p){ return '<div class="sritem" onclick="nomAddRow(\''+p.id+'\',\''+id+'\')">'+CAT(p.type).icon+' '+esc(p.name)+' <span class="sub">'+p.unit+'</span></div>'; }).join('')||'<div class="sritem sub">Ничего не найдено</div>')+'</div>';
};
function collectNomRec(){ document.querySelectorAll('[data-rq]').forEach(function(el){ editRecipe[+el.dataset.rq].qty=+el.value||0; }); }
function collectNomForm(id){
  return {name:$('#gn')?$('#gn').value:'',type:$('#gt')?$('#gt').value:nomTab,unit:$('#gu')?$('#gu').value:'кг',
    department:$('#gdept')?$('#gdept').value:'Кухня / Заготовки',sourceId:$('#gs')?$('#gs').value:'',code1c:$('#gc')?$('#gc').value:'',recipe:editRecipe};
}
window.nomAddRow=function(pid,id){
  collectNomRec();
  if(!editRecipe.find(function(it){ return it.productId===pid; })) editRecipe.push({productId:pid,qty:0});
  drawNomEdit(id||null,collectNomForm(id));
};
window.nomDelRow=function(i,id){ collectNomRec(); editRecipe.splice(i,1); drawNomEdit(id||null,collectNomForm(id)); };
window.nSearch=function(v){
  filterDom(v,'nom-item');
  var c=document.querySelectorAll('.search .clr')[0];
  if(c) c.style.display=v?'block':'none';
};
window.nClear=function(){
  var i=$('#nomSearch');
  if(i) i.value='';
  nSearch('');
  if(i) i.focus();
};
 window.stSearch=function(v){
  filterDom(v,'stock-item');
  var c=document.querySelectorAll('.search .clr')[document.querySelectorAll('.search .clr').length-1];
  if(c) c.style.display=v?'block':'none';
};
window.stClear=function(){
  var i=$('#stockSearch');
  if(i) i.value='';
  stSearch('');
  if(i) i.focus();
};
  window.nomSave=async function(id){
  collectNomRec();
  var body={type:$('#gt').value,unit:$('#gu').value,department:$('#gdept')?$('#gdept').value:'Кухня / Заготовки',recipe:editRecipe.filter(function(it){ return it.qty>0; })};
  if($('#gs')) body.sourceId=$('#gs').value||null;
  if($('#gc')) body.code1c=$('#gc').value.trim();
  if(!$('#gn').disabled) body.name=$('#gn').value.trim();
  if(body.name==='') return toast('Введите наименование');
  try{
    if(id) await api('/products/'+id,'PUT',body); else await api('/products','POST',body);
    toast('Сохранено'); await reload(); render();
  }catch(e){ toast(e.message); }
};

// ====== ОСТАТКИ ======
// Один физический склад — цех тут только группирует список для удобства просмотра,
// на сумму/количество товара не влияет (это не разные "корзины" остатка).
async function scrStock(){
  var showMoney=ME.role==='admin';
  var stockData=await api('/report/stock');
  var isMgrAdmin=ME.role==='admin'||ME.role==='tech';
  if(isMgrAdmin){
    var byType={};
    stockData.forEach(function(r){ if(!byType[r.type]) byType[r.type]=[]; byType[r.type].push(r); });
    var totalVal=0;
    if(showMoney) stockData.forEach(function(r){ totalVal+=r.value||0; });
    var header=showMoney?'<div class="card" style="display:flex;justify-content:space-between"><span>Стоимость всех остатков</span><b>'+money(totalVal)+'</b></div>':'';
    var body=CATS.filter(function(cat){ return byType[cat.id]; }).map(function(cat){
      return card('stcat'+cat.id,
        '<span style="flex:1"><b>'+cat.icon+' '+cat.name+'</b> <span class="sub">'+byType[cat.id].length+' позиций</span></span>',
        '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px">'
        +'<tr><th style="text-align:left;padding:6px;border-bottom:1px solid var(--line)">Продукт</th>'
        +'<th style="text-align:left;padding:6px;border-bottom:1px solid var(--line)">Цех</th>'
        +'<th style="text-align:right;padding:6px;border-bottom:1px solid var(--line)">Кол-во</th>'
        +(showMoney?'<th style="text-align:right;padding:6px;border-bottom:1px solid var(--line)">Сумма</th>':'')
        +'</tr>'
        +byType[cat.id].map(function(r){
          return '<tr><td style="padding:6px;border-bottom:1px solid var(--line)">'+esc(r.name)+'</td>'
            +'<td style="padding:6px;border-bottom:1px solid var(--line)" class="sub">'+esc(r.department||'')+'</td>'
            +'<td style="text-align:right;padding:6px;border-bottom:1px solid var(--line);color:'+(r.qty<0?'var(--red)':'var(--acc)')+'">'+fmt(r.qty)+' '+r.unit+'</td>'
            +(showMoney?'<td style="text-align:right;padding:6px;border-bottom:1px solid var(--line)">'+money(r.value||0)+'</td>':'')
            +'</tr>';
        }).join('')+'</table></div>'
      );
    }).join('') || '<p class="sub">Остатков нет.</p>';
    return header+body+'<button class="btn sec" style="margin-top:8px" onclick="go(\'inv\')">Инвентаризация</button>';
  }
  var depts=DEPARTMENTS.filter(function(d){ return stockData.some(function(r){ return r.department===d; }); });
  if(!stockTabDept||(depts.length&&depts.indexOf(stockTabDept)===-1)) stockTabDept=depts.length>1?'':'';
  var filtered=stockData.filter(function(r){ return !stockTabDept||r.department===stockTabDept; });
  var tabsHtml=depts.length>1?'<div class="tabbar">'+depts.map(function(d){ return '<button class="'+(stockTabDept===d?'on':'')+'" onclick="stockTabDept=\''+esc(d)+'\';renderInPlace()">'+esc(d)+'</button>'; }).join('')+'<button class="'+(stockTabDept===''?'on':'')+'" onclick="stockTabDept=\'\';renderInPlace()">Все</button></div>':'';
  var searchHtml='<div class="search"><input id="stockSearch" placeholder="Найти продукт..." oninput="stSearch(this.value)" autocomplete="off"><span class="clr" onclick="stClear()">✕</span></div>';
  return tabsHtml+searchHtml+'<div class="card stocklist">'+filtered.map(function(r){
    return '<div class="li stock-item" data-name="'+esc(r.name.toLowerCase())+'"><span class="nm">'+CAT(r.type).icon+' '+esc(r.name)+'</span><span class="vl '+(r.qty<0?'neg':'')+'">'+fmt(r.qty)+' '+r.unit+'</span></div>';
  }).join('')+'</div>';
}

// Цех тут — просто фильтр списка для удобства физического пересчёта (считаешь полку за полкой),
// сама инвентаризация всегда пишется на единственный физический склад.
var invDept=null, invVals={};
async function scrInv(){
  var depts=DEPARTMENTS.filter(function(d){ return D.products.some(function(p){ return p.department===d; }); });
  if(!invDept||depts.indexOf(invDept)===-1) invDept=depts[0]||'';
  var isAdmin=ME.role==='admin';
  var tabsHtml=depts.length>1?'<div class="tabbar">'+depts.map(function(d){ return '<button class="'+(invDept===d?'on':'')+'" onclick="invDept=\''+esc(d)+'\';invVals={};renderInPlace()">'+esc(d)+'</button>'; }).join('')+'</div>':'';
  var rows=D.products.filter(function(p){ return p.department===invDept; });
  var listHtml=rows.map(function(p){
    var st=D.stock[p.id];
    var cur=st&&st.total?st.total.qty:0;
    var val=invVals.hasOwnProperty(p.id)?invVals[p.id]:cur;
    return '<div class="li"><span class="nm">'+CAT(p.type).icon+' '+esc(p.name)+'<div class="sub">учёт: '+fmt(cur)+' '+p.unit+'</div></span>'
      +(isAdmin
        ?'<input type="number" step="0.01" inputmode="decimal" value="'+val+'" style="width:100px;text-align:center" onfocus="this.select()" onchange="invChange(\''+p.id+'\',this.value)">'
        :'<span class="vl">'+fmt(cur)+' '+p.unit+'</span>')
      +'</div>';
  }).join('') || '<p class="sub">Нет позиций в этом цехе.</p>';
  var saveBtn=isAdmin?'<button class="btn" style="margin-top:10px" onclick="invSave()">Сохранить инвентаризацию</button>':'';
  var hist='';
  if(isAdmin||ME.role==='tech'){

  var contentHtml='';

    contentHtml='<p class="sub" style="color:var(--red)">'+esc(rep.error)+'</p>';

    contentHtml+='<h3 style="margin:16px 0 4px">'+esc(rep.title)+'</h3>';

    });

window.reportsDownloadCsv=async function(){
  var meta=(reportsListCache||[]).find(function(r){ return r.id===reportsType; })||{period:false};
  var qs='type='+reportsType+'&format=csv';
  if(meta.period){ qs+='&from='+(reportsFrom||today())+'&to='+(reportsTo||today()); }
  try{
    var r=await fetch('/api'+'/reports/run?'+qs,{headers:{'x-token':TOKEN}});
    if(!r.ok) throw new Error('Ошибка скачивания');
    var blob=await r.blob();
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url; a.download=reportsType+(meta.period?('_'+(reportsFrom||today())+'_'+(reportsTo||today())):'')+'.csv';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }catch(e){ toast(e.message); }
};

async function scrAgent(){

      +'<div class="srlist">'+(res.map(function(p){ return '<div class="sritem" onclick="agentPick(\''+p.id+'\')">'+CAT(p.type).icon+' '+esc(p.name)+' <span class="sub">'+(p.salePrice||0)+' ₸</span></div>'; }).join('')||'<div class="sritem sub">Ничего не найдено</div>')+'</div>';

      +'<label>Цена за единицу, ₸</label><input class="big" id="agPrice" type="number" step="1" inputmode="decimal" value="'+(agentPrice||p.salePrice||0)+'" oninput="agentCalc()">'

      +'<div class="row" style="margin-top:8px">'
      +'<div><label>Наличные, ₸</label><input class="big" id="agCash" type="number" step="1" inputmode="decimal" value="'+(agentCash||'')+'" oninput="agentCalc()"></div>'
      +'<div><label>QR / карта, ₸</label><input class="big" id="agQr" type="number" step="1" inputmode="decimal" value="'+(agentQr||'')+'" oninput="agentCalc()"></div>'
      +'</div>'
      +'<div id="agDebt" class="sub" style="margin-top:8px"></div>'
      +'<div style="height:10px"></div><button class="btn" id="agGo" onclick="agentSave()">Оформить продажу</button>'
      +'<button class="btn sec sm" style="margin-top:8px" onclick="agentSel=null;renderInPlace()">← Выбрать другой товар</button>';
  }
  } else {
    // --- режим накладной: клиент+адрес, несколько строк товаров, общий итог ---
    newSaleBody+=agentClientBlock();
    if(agentClientId){
      var cc=agentClientsCache.find(function(x){ return x.id===agentClientId; });
      newSaleBody+='<label>Адрес доставки</label><input id="agAddress" type="text" value="'+esc((cc&&cc.address)||'')+'" placeholder="Город, улица, дом" onblur="agentSaveAddress()">';
    }
    newSaleBody+='<div class="hl" style="margin-top:14px">Позиции</div>';
    if(agentCart.length){
      newSaleBody+=agentCart.map(function(l,i){

      }).join('');

    newSaleBody+='<div class="search" style="margin-top:8px"><input id="agCartSearch" placeholder="Найти и добавить товар..." value="'+esc(agentCartQ)+'" oninput="agentCartSearch(this.value)" autocomplete="off"></div><div id="agCartList"></div>';
    var cartTotal=agentCart.reduce(function(a,l){ return a+l.qty*l.price; },0);
    newSaleBody+='<div class="li" style="margin-top:10px"><span class="nm"><b>Итого</b></span><span class="vl"><b>'+money(cartTotal)+'</b></span></div>'
      +'<div class="row" style="margin-top:8px">'
      +'<div><label>Наличные, ₸</label><input class="big" id="agCash" type="number" step="1" inputmode="decimal" value="'+(agentCash||'')+'" oninput="agentCartCalc()"></div>'
      +'<div><label>QR / карта, ₸</label><input class="big" id="agQr" type="number" step="1" inputmode="decimal" value="'+(agentQr||'')+'" oninput="agentCartCalc()"></div>'
      +'</div>'
      +'<div id="agCartDebt" class="sub" style="margin-top:8px"></div>'

  // --- блок: мои продажи сегодня ---
  var todayList=todaysSales.length ? todaysSales.slice().reverse().map(function(s){
    var debtVal=(s.sum!=null&&s.paidAmount!=null)?r2f(s.sum-s.paidAmount):0;
    var ds=s.docStatus;
    var docPill=ds ? (ds.status==='created' ? ' <span class="pill ok" title="'+esc(ds.docNumber||'')+'">1С ✓</span>' : ' <span class="pill bad" title="'+esc(ds.message||'')+'">1С ошибка</span>') : ' <span class="pill warn">1С: ожидает</span>';
    return '<div class="li"><span class="nm">'+esc(agentOpTitle(s))+' × '+(s.type==='waybill'?s.items.length+' поз.':fmt(s.qty))+(s.client?' · '+esc(s.client):'')+'<div class="sub">'+opTime(s)+docPill+'</div></span>'
      +(s.paid?'<span class="pill ok">оплачено'+(s.sum!=null?' · '+money(s.sum):'')+'</span>':'<span class="pill bad">долг '+money(debtVal)+'</span>')+'</div>';
  }).join('') : '<p class="sub">Сегодня продаж ещё не было.</p>';
  var todayCard=card('agtoday','<b>📋 Мои продажи сегодня ('+todaysSales.length+')</b>',todayList);

  // --- блок: долги (за клиентами, по всем моим продажам) ---
  var debtsBody=debts.length ? debts.map(function(s){
    var debtVal=(s.sum!=null&&s.paidAmount!=null)?r2f(s.sum-s.paidAmount):0;
    return '<div class="card" style="border-color:var(--red)"><b>'+esc(s.client||'Без имени')+'</b> <span class="sub">'+esc(agentOpTitle(s))+'</span>'
      +'<div style="margin-top:4px" class="pill bad">долг '+money(debtVal)+'</div>'
      +'<div class="row" style="margin-top:8px">'
      +'<input id="dp'+s.id+'" type="number" step="1" placeholder="Сумма">'
      +'<select id="dm'+s.id+'" style="max-width:120px"><option value="cash">Нал</option><option value="qr">QR</option></select>'
      +'</div><button class="btn sec sm" style="margin-top:8px" onclick="agentPayDebt(\''+s.id+'\')">Погасить</button></div>';
  }).join('') : '<p class="sub">Долгов нет 🎉</p>';
  var debtsCard=card('agdebts','<b>💰 Долги ('+debts.length+')</b>',debtsBody);

  // --- блок: наличные на руках (нужно периодически сдавать) ---
  var cashBody='<div class="li"><span class="nm">На руках сейчас</span><span class="vl" style="font-size:18px">'+money(cash.onHand)+'</span></div>'
    +(cash.onHand>0.01
      ? '<label>Сумма к сдаче, ₸</label><input class="big" id="chAmount" type="number" step="1" inputmode="decimal" value="'+cash.onHand+'">'
        +'<label>Комментарий (необязательно)</label><input id="chNote" type="text" placeholder="Кому/как сдали">'
        +'<div style="height:10px"></div><button class="btn" onclick="cashHandover()">Сдать выручку</button>'
      : '<p class="sub">Сдавать пока нечего.</p>')
    +(cash.history&&cash.history.length
      ? '<div class="hl" style="margin-top:14px">История сдач</div>'+cash.history.map(function(h){
          return '<div class="li"><span class="nm">'+new Date(h.ts).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+(h.note?' · '+esc(h.note):'')+'</span><span class="vl">'+money(h.amount)+'</span></div>';
        }).join('')
      : '');
  var cashCard=card('agcash','<b>💵 Наличные на руках</b>'+(cash.onHand>0.01?' <span class="pill warn">'+money(cash.onHand)+'</span>':''),cashBody);

  // --- блок: аналитика ---
  var analyticsBody='<div class="row">'
    +'<div><label>С</label><input type="date" value="'+from+'" onchange="agentFrom=this.value;render()"></div>'
    +'<div><label>По</label><input type="date" value="'+to+'" onchange="agentTo=this.value;render()"></div>'
    +'</div><div class="row" style="margin-top:8px">'
    +'<button class="btn sec sm" onclick="agentSetRange(0)">Сегодня</button>'
    +'<button class="btn sec sm" onclick="agentSetRange(7)">Неделя</button>'
    +'<button class="btn sec sm" onclick="agentSetRange(30)">Месяц</button>'
    +'</div>'
    +'<div class="li"><span class="nm">Продаж</span><span class="vl">'+rep.totals.count+'</span></div>'
    +'<div class="li"><span class="nm">Выручка</span><span class="vl">'+money(rep.totals.revenue)+'</span></div>'
    +'<div class="li"><span class="nm">Наличные</span><span class="vl">'+money(rep.totals.cash)+'</span></div>'

function r2f(x){ return Math.round((+x||0)*100)/100; }
function agentOpTitle(s){ return s.type==='waybill' ? 'Накладная ('+s.items.length+' поз.)' : P(s.productId).name; }
window.agentSearch=function(v){ agentQ=v; renderInPlace(); };
window.agentClear=function(){ agentQ=''; renderInPlace(); };
window.agentPick=function(id){ agentSel=id; agentQty=1; var p=P(id); agentPrice=p.salePrice||0; agentClientId=null; agentClientQ=''; agentCash=0; agentQr=0; exp.agnew=true; render(); };
window.agentCalc=function(){
  agentQty=+($('#agQty')?$('#agQty').value:1)||0;
  agentPrice=+($('#agPrice')?$('#agPrice').value:0)||0;
  agentCash=+($('#agCash')?$('#agCash').value:0)||0;
  agentQr=+($('#agQr')?$('#agQr').value:0)||0;
  var total=r2f(agentQty*agentPrice);
  var paid=r2f(agentCash+agentQr);
  var debt=Math.max(0,r2f(total-paid));
  if($('#agTotal')) $('#agTotal').textContent='Итого: '+money(total);
  if($('#agDebt')) $('#agDebt').innerHTML=debt>0.001?'<span class="pill bad">долг останется: '+money(debt)+'</span>':'<span class="pill ok">оплачено полностью</span>';
};

async function scrCost(){

  return '<h2>Себестоимость сейчас</h2>'
    +'<p class="sub" style="margin-bottom:10px">Нажмите строку — раскроется состав.</p>'
    +CATS.filter(function(cat){ return grouped[cat.id]; }).map(function(cat){
      return '<div class="hl">'+cat.icon+' '+cat.name+'</div>'
        +grouped[cat.id].map(function(d){
          var actBtn=d.status==='approved'
            ?'<button class="btn sec sm" onclick="event.stopPropagation();recStatus(\''+d.productId+'\',\'reopen\',\'Вернуть на доработку?\')">🔓 На доработку</button>'
            :'<button class="btn sec sm" onclick="event.stopPropagation();recStatus(\''+d.productId+'\',\'approve\',\'Утвердить?\')">✅ Утвердить</button>';
          var items=d.items.map(function(i){

          }).join('');
          var margin=d.salePrice>0?d.salePrice-d.total:null;

          var priceBlock='<div class="row" style="margin-top:8px;align-items:center">'
            +'<div style="flex:1"><label style="margin:0">Цена продажи, ₸</label>'
            +'<input class="big" type="number" step="1" inputmode="decimal" id="sp'+d.productId+'" value="'+(d.salePrice||'')+'" onclick="event.stopPropagation()"></div>'

  var name=$('#nuName').value.trim(), role=$('#nuRole').value, pin=$('#nuPin').value.trim();

  catch(e){ toast(e.message); }
};
window.changePin=async function(id){
  var el=$('#pin'+id);

  if(!confirm('Сменить PIN? Все, кто входит под этим кодом (включая расширение 1С, если оно им пользуется), должны узнать новый.')) return;

          return '<div class="li"><span class="nm">'+(it.client?esc(it.client):'без клиента')+' · '+money(it.sum)+'<div class="sub">'+new Date(it.ts).toLocaleDateString('ru-RU')+'</div>'+dsPill+'</span></div>';
        }).join('')+'</div>'
        +'<p class="sub" style="margin-top:6px">Если тут висит «1С отчитывалась: №...» — значит документ в 1С был, но потом его удалили/распровели вручную. Если «1С не отчитывалась» — запусти загрузку продаж в 1С ещё раз.</p>';
    }
    if(sld.notInSkyMeal&&sld.notInSkyMeal.length){
      salesHtml+='<div class="hl">Документ в 1С ссылается на несуществующую продажу ('+sld.notInSkyMeal.length+')</div>'
        +'<div class="stocklist">'+sld.notInSkyMeal.map(function(it){ return '<div class="li"><span class="nm">№'+esc(it.docNumber||'?')+'<div class="sub">ref: '+esc(it.ref)+'</div></span></div>'; }).join('')+'</div>'
        +'<p class="sub" style="margin-top:6px">Обычно это продажа, которую потом удалили/сторнировали на сайте — документ в 1С стоит проверить вручную.</p>';
    }
    if((!sld.notPosted||!sld.notPosted.length)&&(!sld.missingIn1c||!sld.missingIn1c.length)&&(!sld.notInSkyMeal||!sld.notInSkyMeal.length)){
      salesHtml+='<p class="sub" style="margin-top:8px">Расхождений нет — все продажи есть в 1С и проведены.</p>';
    }
  } else {
    salesHtml+='<p class="sub" style="margin-top:6px">Сверки ещё не было — запусти в 1С «Проверить реализацию», либо проверь вручную ниже.</p>';
  }
  salesHtml+='<div style="height:8px"></div><button class="btn sec sm" onclick="salesPasteOpen=!salesPasteOpen;renderInPlace()">'+(salesPasteOpen?'Скрыть ручную проверку':'Проверить вручную (вставить JSON)')+'</button>';
  if(salesPasteOpen){
    salesHtml+='<div style="height:8px"></div><label>JSON вида {"items":[{"ref":"sale|o1cbei","docNumber":"000123","posted":true}]}</label>'
      +'<textarea id="salesPasteArea" rows="6" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font-family:monospace;font-size:12px">'+esc(salesPasteText)+'</textarea>'
      +'<div style="height:8px"></div><button class="btn sec" onclick="salesCheckPaste()">Проверить</button>';
  }
  salesHtml+='</div>';

  // ---- блок сверки оплат ----
  var payHtml='<div class="card"><b>💳 Сверка оплат с 1С</b><p class="sub" style="margin-top:4px">Касса/банк в 1С — источник правды по факту оплаты. Здесь видно, где сайт и 1С расходятся.</p>';
  if(pd){
    payHtml+='<p class="sub" style="margin-top:6px">Последняя сверка: '+new Date(pd.ts).toLocaleString('ru-RU')+' · получено позиций: '+pd.totalIncoming+' · совпадает: '+pd.matchedSame+'</p>';
    if(pd.mismatches&&pd.mismatches.length){
      payHtml+='<div class="hl">Расхождения ('+pd.mismatches.length+')</div>'
        +'<div class="stocklist">'+pd.mismatches.map(function(m){
          return '<div class="li"><span class="nm">'+esc(m.name)+(m.client?' · '+esc(m.client):'')+'<div class="sub">сайт: '+(m.skyMealPaid?'оплачено '+money(m.skyMealAmount):'не оплачено, '+money(m.skyMealAmount))+' · 1С: '+(m.oneCPaid?'оплачено '+money(m.oneCAmount):'не оплачено, '+money(m.oneCAmount))+'</div></span></div>';
        }).join('')+'</div>';
    }
    if(pd.notFound&&pd.notFound.length){
      payHtml+='<div class="hl">Ref из 1С не найден на сайте ('+pd.notFound.length+')</div>'
        +'<div class="stocklist">'+pd.notFound.map(function(it){ return '<div class="li"><span class="nm">'+esc(it.ref)+'</span></div>'; }).join('')+'</div>';
    }
    if((!pd.mismatches||!pd.mismatches.length)&&(!pd.notFound||!pd.notFound.length)){
      payHtml+='<p class="sub" style="margin-top:8px">Расхождений нет.</p>';
    }
    if(pd.mismatches&&pd.mismatches.length){
      payHtml+='<div style="height:8px"></div><button class="btn grn" onclick="payApply()">Применить сверку (взять факт из 1С)</button>';
    }
  } else {
    payHtml+='<p class="sub" style="margin-top:6px">Сверки ещё не было — запусти в 1С «Сверить оплаты», либо проверь вручную ниже.</p>';
  }
  payHtml+='<div style="height:8px"></div><button class="btn sec sm" onclick="payPasteOpen=!payPasteOpen;renderInPlace()">'+(payPasteOpen?'Скрыть ручную проверку':'Проверить вручную (вставить JSON)')+'</button>';
  if(payPasteOpen){
    payHtml+='<div style="height:8px"></div><label>JSON вида {"items":[{"ref":"sale|o1cbei","paid":true,"paidAmount":1500}]}</label>'
      +'<textarea id="payPasteArea" rows="6" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font-family:monospace;font-size:12px">'+esc(payPasteText)+'</textarea>'
      +'<div style="height:8px"></div><button class="btn sec" onclick="payCheckPaste()">Проверить</button>';
  }
  payHtml+='</div>';

  // ---- блок сверки спецификаций (состав/граммовки) с 1С — обратная синхронизация ----
  var specsHtml='<div class="card"><b>📐 Сверка спецификаций с 1С</b><p class="sub" style="margin-top:4px">Если состав техкарты поправили прямо в 1С — здесь видно расхождение с сайтом. Позиции, которые 1С убрала, автоматически НЕ удаляются — только показываются, убрать нужно руками.</p>';
  if(spd){
    specsHtml+='<p class="sub" style="margin-top:6px">Последняя сверка: '+new Date(spd.ts).toLocaleString('ru-RU')+' · получено спецификаций: '+spd.totalIncoming+'</p>';
    if(spd.ownerNotFound&&spd.ownerNotFound.length){
      specsHtml+='<div class="hl">Владелец не найден на сайте ('+spd.ownerNotFound.length+')</div>'
        +'<div class="stocklist">'+spd.ownerNotFound.map(function(it){ return '<div class="li"><span class="nm">'+esc(it.name||'?')+'<div class="sub">код '+esc(it.code)+'</div></span></div>'; }).join('')+'</div>'
        +'<p class="sub" style="margin-top:6px">Сначала сверь номенклатуру — у этого блюда на сайте нет такого code1c.</p>';
    }
    if(spd.changed&&spd.changed.length){
      specsHtml+='<div class="hl">Есть расхождения ('+spd.changed.length+' техкарт)</div>'
        +'<div class="stocklist">'+spd.changed.map(function(row){
          var lines=row.changes.map(function(ch){
            if(ch.type==='qty') return 'изменить: '+esc(ch.name)+' '+fmt(ch.oldQty)+' → '+fmt(ch.newQty);
            if(ch.type==='add') return 'добавить: '+esc(ch.name)+' '+fmt(ch.qty);
            if(ch.type==='removedIn1c') return 'в 1С убрано (не тронуто): '+esc(ch.name)+' '+fmt(ch.qty);
            if(ch.type==='componentNotFound') return 'компонент не найден на сайте: '+esc(ch.name||ch.code);
            return '';
          }).join('<br>');
          return '<div class="li"><span class="nm">'+esc(row.dishName)+'<div class="sub">'+lines+'</div></span></div>';
        }).join('')+'</div>'
        +'<div style="height:8px"></div><button class="btn grn" onclick="specsApply()">Применить сверку (изменить/добавить)</button>';
    }
    if((!spd.ownerNotFound||!spd.ownerNotFound.length)&&(!spd.changed||!spd.changed.length)){
      specsHtml+='<p class="sub" style="margin-top:8px">Расхождений нет.</p>';
    }
  } else {
    specsHtml+='<p class="sub" style="margin-top:6px">Сверки ещё не было — запусти в 1С «Сверить спецификации», либо проверь вручную ниже.</p>';
  }
  specsHtml+='<div style="height:8px"></div><button class="btn sec sm" onclick="specsPasteOpen=!specsPasteOpen;renderInPlace()">'+(specsPasteOpen?'Скрыть ручную проверку':'Проверить вручную (вставить JSON)')+'</button>';
  if(specsPasteOpen){
    specsHtml+='<div style="height:8px"></div><label>JSON вида {"items":[{"ownerCode":"00000000098","ownerName":"Омлет","components":[{"code":"00000000039","name":"Молоко","qty":40}]}]}</label>'
      +'<textarea id="specsPasteArea" rows="6" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font-family:monospace;font-size:12px">'+esc(specsPasteText)+'</textarea>'
      +'<div style="height:8px"></div><button class="btn sec" onclick="specsCheckPaste()">Проверить</button>';
  }
  specsHtml+='</div>';

  return '<h2>Обмен с 1С</h2>'
    +nomHtml
    +stHtml
    +clHtml
    +salesHtml
    +payHtml
    +specsHtml
    +'<div class="card"><label>Дата выгрузки</label>'
    +'<input type="date" value="'+d+'" onchange="syncDate=this.value;render()">'
    +'<div style="height:8px"></div>'
    +'<p style="font-size:13px">Документов: <b>'+r.Документы.length+'</b></p>'
    +docsHtml
    +'<div style="height:8px"></div>'
    +'<button class="btn sec" onclick="syncCopy()">Скопировать JSON для 1С</button></div>'
    +card('rcpt','<span style="flex:1"><b>📦 Ручной ввод поступления</b></span><span class="sub">до подключения 1С</span>',rcptHtml)
    +settingsHtml;
}
window.saveSettings=async function(){
  var v=+$('#diffTh').value;
  if(!(v>0)) return toast('Введите число больше нуля');
  try{ await api('/settings','PUT',{diffThresholdPct:v}); toast('✅ Сохранено'); await reload(); render(); }
  catch(e){ toast(e.message); }
};
window.syncCopy=async function(){
  var r=await api('/1c/export?date='+(syncDate||today()));
  await navigator.clipboard.writeText(JSON.stringify(r,null,1));
  toast('JSON скопирован');
};
window.rSave=async function(){
  var q=+$('#rq').value, c=+$('#rc').value;
  if(!(q>0)||!(c>0)) return toast('Заполните количество и цену');
  try{ await api('/ops','POST',{type:'receipt',productId:$('#rp').value,qty:q,price:c}); toast('✅ Приход записан'); await reload(); render(); }
  catch(e){ toast(e.message); }
};
window.nomCheckPaste=async function(){
  nomPasteText=$('#nomPasteArea').value;
  var parsed;
  try{ parsed=JSON.parse(nomPasteText); }
  catch(e){ return toast('Это не валидный JSON'); }
  var items=Array.isArray(parsed)?parsed:parsed.items;
  if(!Array.isArray(items)) return toast('Ожидается {"items":[...]} или массив');
  try{
    await api('/1c/nomenclature-diff','POST',{items:items});
    toast('✅ Сверка выполнена'); nomPasteOpen=false; renderInPlace();
  }catch(e){ toast(e.message); }
};
window.nomApply=async function(){
  var createMissing=$('#nomCreateMissing')&&$('#nomCreateMissing').checked;
  if(!confirm(createMissing?'Обновить совпавшие наименования и создать новые позиции из 1С?':'Обновить только совпавшие наименования? (новые позиции не будут созданы)')) return;
  try{
    var nd=await api('/1c/nomenclature-diff');
    if(!nd) return toast('Нет данных сверки');
    var items=(nd.matchedDetails||[]).map(function(m){ return {code:m.code,name:m.theirName}; })
      .concat((nd.newInOneC||[]).map(function(it){ return {code:it.code,name:it.name,unit:it.unit}; }));
    var r=await api('/1c/nomenclature-apply','POST',{items:items,createMissing:createMissing});
    toast('✅ Обновлено: '+r.updated+', связано по имени: '+r.linked+', создано: '+r.created); await reload(); render();
  }catch(e){ toast(e.message); }
};

  try{
    var sd=await api('/1c/stock-diff');

var SCREENS={work:scrWork,prod:scrProd,stock:scrStock,inv:scrInv,cost:scrCost,output:scrOutput,sync:scrSync,nom:scrNom,wo:scrWo,orders:scrOrders,users:scrUsers,losses:scrLosses,sales:scrSales,agent:scrAgent,reports:scrReports};
async function render(){
  if(!ME) return renderLogin();
  var fn=SCREENS[screen]||scrStock;
  var out=fn();
  shell(out instanceof Promise?'<p class="sub">Загрузка…</p>':out);
  if(out instanceof Promise){
    try{ $('#m').innerHTML=await out; }
    catch(e){ $('#m').innerHTML='<p class="sub">'+esc(e.message)+'</p>'; }
  }
}
  window.addEventListener('popstate', function(){ wSel=null; renderInPlace(); });
(async function(){
  if(ME){ try{ await reload(); }catch(e){ logout(); return; } }
  render();
})();
</script>
